          '<div><div class="dt" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-soft);font-weight:700">Total Paid</div><div class="dd" style="font-size:15px;font-weight:660;color:var(--success)">' + money(total) + '</div></div>' +
          '</div><div class="divider"></div>' +
          '<div class="flex between center"><span class="small muted">Balance due after this payment</span><b style="font-size:17px;letter-spacing:-.03em;color:' + (balance > 0 ? 'var(--danger)' : 'var(--success)') + '">' + money(balance) + '</b></div>';
      };
      sel.addEventListener('change', update);
      amt.addEventListener('input', update);
      update();

      wrap.querySelector('#pf-save').addEventListener('click', () => {
        const custId = wrap.querySelector('#pf-cust').value;
        const propId = sel.value;
        const amount = Number(amt.value || 0);
        if (!amount || amount <= 0) { Toast.show('Enter a valid amount', 'error'); return; }
        const prop = propertyService.byId(propId) || {};
        const rec = paymentService.create({
          customerId: custId, propertyId: propId, projectId: prop.projectId,
          managerId: prop.managerId || State.user.id,
          amount: amount,
          method: wrap.querySelector('#pf-method').value,
          txnId: wrap.querySelector('#pf-txn').value || ('TXN' + Date.now().toString().slice(-8)),
          date: wrap.querySelector('#pf-date').value || todayISO(),
          notes: wrap.querySelector('#pf-notes').value
        });
        notificationService.add({ type: 'payment', title: 'Payment verification required', desc: rec.id + ' — ' + money(amount) + ' awaiting verification', link: '#/' + State.role + '/payments' });
        auditService.log('Recorded payment', 'Payments', 'Payment #' + rec.id);
        close();
        Toast.show('Payment recorded', 'success', 'Pending admin verification');
        renderView();
      });
    }
  });
}

/* ---- Verify payment -------------------------------------------- */
function verifyPayment(payId) {
  const p = paymentService.byId(payId);
  if (!p) return;
  const prop = propertyService.byId(p.propertyId) || {};
  const paid = paymentService.paidForProperty(p.propertyId);
  const balance = Math.max(0, (prop.price || 0) - paid);
  Modal.open({
    title: 'Verify this payment?',
    subtitle: 'A receipt will be generated automatically after verification.',
    size: 'md',
    body: '<div class="dl">' +
      '<div><div class="dt">Customer</div><div class="dd">' + esc(customerName(p.customerId)) + '</div></div>' +
      '<div><div class="dt">Property</div><div class="dd">' + esc(propertyName(p.propertyId)) + '</div></div>' +
      '<div><div class="dt">Amount</div><div class="dd">' + money(p.amount) + '</div></div>' +
      '<div><div class="dt">Method</div><div class="dd">' + esc(p.method) + '</div></div>' +
      '<div><div class="dt">Transaction ID</div><div class="dd mono">' + esc(p.txnId) + '</div></div>' +
      '<div><div class="dt">Date</div><div class="dd">' + fmtDate(p.date) + '</div></div>' +
      '</div><div class="divider"></div>' +
      '<div class="flex between center"><span class="small muted">Balance after this payment</span><b style="font-size:16px">' + money(Math.max(0, balance - p.amount)) + '</b></div>',
    actions: '<button class="btn outline" data-modal-close>Cancel</button>' +
             '<button class="btn danger" id="pv-reject">Reject</button>' +
             '<button class="btn primary" id="pv-ok">' + icon('check', 15) + ' Verify Payment</button>',
    onMount: (wrap, close) => {
      wrap.querySelector('#pv-ok').addEventListener('click', () => {
        const rec = paymentService.verify(payId, State.user.id);
        auditService.log('Verified payment', 'Payments', 'Payment #' + payId);
        notificationService.add({ type: 'payment', title: 'Payment verified', desc: rec.receiptNo + ' — ' + money(rec.amount), link: '#/' + State.role + '/receipts' });
        close();
        Toast.show('Payment verified', 'success', 'Receipt ' + rec.receiptNo + ' generated');
        renderView();
        setTimeout(() => openReceiptModal(payId), 420);
      });
      wrap.querySelector('#pv-reject').addEventListener('click', () => {
        paymentService.reject(payId, State.user.id);
        auditService.log('Rejected payment', 'Payments', 'Payment #' + payId);
        close();
        Toast.show('Payment rejected', 'warning', 'The manager will be notified');
        renderView();
      });
    }
  });
}

      '<div class="field"><label>Unit Number *</label><input class="input" data-d="unitNumber" value="' + esc(draft.unitNumber) + '" placeholder="1204"></div>' +
      '<div class="field"><label>Project *</label><select class="select" data-d="projectId">' + projects.map(p => '<option value="' + p.id + '"' + (draft.projectId === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Property Type *</label><select class="select" data-d="type">' + ['2 BHK', '3 BHK', '4 BHK', 'Studio', 'Villa', 'Shop', 'Office'].map(t => '<option' + (draft.type === t ? ' selected' : '') + '>' + t + '</option>').join('') + '</select></div>' +
      '<div class="field full"><label>Description</label><textarea class="textarea" data-d="description" placeholder="Describe the unit, its highlights and surroundings…">' + esc(draft.description) + '</textarea></div>' +
      '</div>';
    if (step === 1) return '<div class="form-grid">' +
      '<div class="field full"><label>Address</label><input class="input" data-d="address" value="' + esc(draft.address) + '"></div>' +
      '<div class="field"><label>City</label><input class="input" data-d="city" value="' + esc(draft.city) + '"></div>' +
      '<div class="field"><label>State</label><input class="input" data-d="state" value="' + esc(draft.state) + '"></div>' +
      '<div class="field"><label>Pincode</label><input class="input" data-d="pincode" value="' + esc(draft.pincode) + '"></div>' +
      '<div class="field"><label>Google Maps URL</label><input class="input" data-d="mapUrl" value="' + esc(draft.mapUrl) + '" placeholder="https://maps.google.com/?q=..."></div>' +
      '<div class="field"><label>Latitude</label><input class="input" data-d="lat" value="' + esc(draft.lat) + '"></div>' +
      '<div class="field"><label>Longitude</label><input class="input" data-d="lng" value="' + esc(draft.lng) + '"></div>' +
      '</div>';
    if (step === 2) {
      const finalPrice = Number(draft.price) - Number(draft.discount || 0);
      return '<div class="form-grid">' +
        '<div class="field"><label>Base Price (₹)</label><input class="input" type="number" data-d="price" value="' + draft.price + '"></div>' +
        '<div class="field"><label>Price per sq.ft (₹)</label><input class="input" type="number" data-d="pricePerSqft" value="' + draft.pricePerSqft + '"></div>' +
        '<div class="field"><label>Maintenance (₹/sq.ft)</label><input class="input" type="number" step="0.1" data-d="maintenance" value="' + draft.maintenance + '"></div>' +
        '<div class="field"><label>Booking Amount (₹)</label><input class="input" type="number" data-d="bookingAmount" value="' + draft.bookingAmount + '"></div>' +
        '<div class="field"><label>Discount (₹)</label><input class="input" type="number" data-d="discount" value="' + draft.discount + '"></div>' +
        '<div class="field"><label>Final Price (computed)</label><input class="input" value="' + money(finalPrice) + '" readonly></div>' +
        '</div>';
    }
    if (step === 3) return '<p class="small muted mb-14">Select all amenities available in this unit.</p><div class="check-grid">' +
      allAmenities.map(a => '<label class="check-tile' + (draft.amenities.indexOf(a.name) !== -1 ? ' on' : '') + '" data-am="' + esc(a.name) + '">' +
      '<span class="box">' + icon('check', 11) + '</span>' + esc(a.name) + '</label>').join('') + '</div>';
    if (step === 4) return '<div class="dropzone" data-dropzone><div class="dzic">' + icon('image', 22) + '</div>' +
      '<b data-dz-label>Drop property images here</b><span>or click to browse · JPG, PNG up to 5 MB each</span></div>' +
      '<div class="media-grid mt-20">' + [1, 2, 3, 4].map(i => '<div class="media-card"><img src="' + thumb('Gallery ' + i, 40 + i * 20) + '" alt=""><div class="mcinfo"><b>image-' + i + '.jpg</b><span>' + (i === 1 ? 'Cover image' : 'Gallery') + '</span></div></div>').join('') + '</div>' +
      '<p class="tiny soft mt-14">In this prototype images are generated placeholders. Cover image selection is available in production.</p>';
    if (step === 5) return '<div class="dropzone" data-dropzone><div class="dzic">' + icon('file', 22) + '</div>' +
      '<b data-dz-label>Upload floor plan</b><span>PDF or high-resolution image</span></div>' +
      '<div class="card mt-20" style="background:var(--surface-2)"><div class="card-body" style="text-align:center">' +
      '<img src="' + thumb('Floor Plan', 60) + '" alt="Floor plan preview" style="max-width:100%;border-radius:12px;border:1px solid var(--border)"></div></div>';
    if (step === 6) return '<div class="form-grid">' +
      '<div class="field"><label>RERA Number</label><input class="input" data-d="rera" value="' + esc(draft.rera) + '" placeholder="UPRERAAGT..."></div>' +
      '<div class="field"><label>Brochure</label><input class="input" data-d="brochure" value="' + esc(draft.brochure) + '" placeholder="brochure.pdf"></div>' +
      '<div class="field full"><label>Legal Documents</label><input class="input" data-d="legal" value="' + esc(draft.legal) + '" placeholder="title-deed.pdf, noc.pdf"></div>' +
      '</div><div class="dropzone mt-20" data-dropzone><div class="dzic">' + icon('upload', 22) + '</div><b data-dz-label>Drop approval documents</b><span>RERA approval, layout approvals</span></div>';
    if (step === 7) return '<div class="form-grid">' +
      '<div class="field full"><label>Meta Title</label><input class="input" data-d="metaTitle" value="' + esc(draft.metaTitle) + '" placeholder="3 BHK in Lucknow | Skyline Residency"></div>' +
      '<div class="field full"><label>Meta Description</label><textarea class="textarea" data-d="metaDescription" placeholder="150–160 characters">' + esc(draft.metaDescription) + '</textarea></div>' +
      '<div class="field full"><label>Keywords</label><input class="input" data-d="keywords" value="' + esc(draft.keywords) + '" placeholder="3 bhk lucknow, skyline residency"></div>' +
      '<div class="field full"><label>URL Slug</label><input class="input" data-d="slug" value="' + esc(draft.slug) + '" placeholder="skyline-residency-tower-a-1204"></div>' +
      '</div>';
    /* publish */
    const pj = projectService.byId(draft.projectId) || {};
    return '<div class="card" style="background:var(--surface-2);box-shadow:none"><div class="card-body">' +
      '<h4 style="font-size:14px;margin-bottom:14px">Review before publishing</h4>' +
      '<div class="dl">' +
      '<div><div class="dt">Property</div><div class="dd">' + esc(draft.name || '—') + '</div></div>' +
      '<div><div class="dt">Project</div><div class="dd">' + esc(pj.name || '—') + '</div></div>' +
      '<div><div class="dt">Type</div><div class="dd">' + esc(draft.type) + '</div></div>' +
      '<div><div class="dt">Unit</div><div class="dd">' + esc(draft.unitNumber || '—') + '</div></div>' +
      '<div><div class="dt">Location</div><div class="dd">' + esc((draft.city || pj.city || '—')) + '</div></div>' +
      '<div><div class="dt">Final Price</div><div class="dd">' + money(draft.price - draft.discount) + '</div></div>' +
      '<div><div class="dt">Amenities</div><div class="dd">' + draft.amenities.length + ' selected</div></div>' +
      '<div><div class="dt">Assigned Manager</div><div class="dd">' + esc(userName(draft.managerId)) + '</div></div>' +
      '</div>' +
      '<div class="field mt-20"><label>Assign Manager</label><select class="select" data-d="managerId">' +
      managers.map(m => '<option value="' + m.id + '"' + (draft.managerId === m.id ? ' selected' : '') + '>' + esc(m.name) + '</option>').join('') + '</select></div>' +
      '</div></div>';
  };

  const syncDraft = (wrap) => {
    wrap.querySelectorAll('[data-d]').forEach(el => {
      const k = el.dataset.d;
      if (el.type === 'number') draft[k] = Number(el.value || 0);
      else draft[k] = el.value;
    });
  };

  Modal.open({
    title: 'Add Property',
    subtitle: 'A guided 9-step workflow. Nothing is published until the final step.',
    size: 'xl',
    body: '<div class="steps" id="wiz-steps">' + steps.map((s, i) =>
      '<div class="step' + (i === step ? ' active' : '') + (i < step ? ' done' : '') + '"><span class="sn">' + (i < step ? '✓' : (i + 1)) + '</span>' + esc(s) + '</div>').join('') + '</div>' +
      '<div id="wiz-body">' + renderStep() + '</div>',
    footClass: 'between',
    actions: '<div class="flex gap-10" style="width:100%;justify-content:space-between">' +
      '<button class="btn ghost" id="wiz-draft">Save Draft</button>' +
      '<div class="flex gap-10">' +
      '<button class="btn outline" id="wiz-prev"' + (step === 0 ? ' disabled' : '') + '>Back</button>' +
      (step < steps.length - 1
        ? '<button class="btn primary" id="wiz-next">Next ' + icon('chevRight', 15) + '</button>'
        : '<button class="btn gold" id="wiz-publish">' + icon('check', 15) + ' Publish Property</button>') +
      '</div></div>',
    onMount: (wrap, close) => {
      const refresh = () => {
        syncDraft(wrap);
        wrap.querySelector('#wiz-steps').innerHTML = steps.map((s, i) =>
          '<div class="step' + (i === step ? ' active' : '') + (i < step ? ' done' : '') + '"><span class="sn">' + (i < step ? '✓' : (i + 1)) + '</span>' + esc(s) + '</div>').join('');
        wrap.querySelector('#wiz-body').innerHTML = renderStep();
        bindWizardBody();
        const prev = wrap.querySelector('#wiz-prev');
        const next = wrap.querySelector('#wiz-next');
        const pub = wrap.querySelector('#wiz-publish');
        if (prev) prev.disabled = step === 0;
        if (next) next.style.display = step < steps.length - 1 ? '' : 'none';
        if (pub) pub.style.display = step === steps.length - 1 ? '' : 'none';
      };
      const bindWizardBody = () => {
        const bodyEl = wrap.querySelector('#wiz-body');
        bodyEl.querySelectorAll('[data-am]').forEach(t => t.addEventListener('click', () => {
          const n = t.dataset.am;
          const i = draft.amenities.indexOf(n);
          if (i === -1) draft.amenities.push(n); else draft.amenities.splice(i, 1);
          t.classList.toggle('on');
        }));
        bodyEl.querySelectorAll('[data-dropzone]').forEach(dz => {
          dz.addEventListener('click', () => simulateUpload(dz));
        });
        bodyEl.querySelectorAll('[data-d]').forEach(el => {
          el.addEventListener('change', () => { syncDraft(wrap); if (el.dataset.d === 'price' || el.dataset.d === 'discount') refresh(); });
        });
      };
      bindWizardBody();

      const prevBtn = wrap.querySelector('#wiz-prev');
      const nextBtn = wrap.querySelector('#wiz-next');
      if (prevBtn) prevBtn.addEventListener('click', () => { if (step > 0) { syncDraft(wrap); step--; refresh(); } });
      if (nextBtn) nextBtn.addEventListener('click', () => { syncDraft(wrap); if (step < steps.length - 1) { step++; refresh(); } });
      wrap.querySelector('#wiz-draft').addEventListener('click', () => {
        syncDraft(wrap);
        Toast.show('Draft saved', 'info', 'Prototype drafts are not persisted server-side');
      });
      const pubBtn = wrap.querySelector('#wiz-publish');
      if (pubBtn) pubBtn.addEventListener('click', () => {
        syncDraft(wrap);
        if (!draft.name.trim()) { Toast.show('Property name is required', 'error', 'Go back to step 1'); step = 0; refresh(); return; }
        const pj = projectService.byId(draft.projectId) || {};
        const rec = propertyService.create({
          name: draft.name || (pj.name + ' - ' + draft.unitNumber),
          unitNumber: draft.unitNumber || String(ri(101, 1999)),
          projectId: draft.projectId,
          type: draft.type,
          managerId: draft.managerId,
          location: (draft.city || pj.city) + ', ' + (pj.locality || ''),
          city: draft.city || pj.city,
          area: 1200,
          price: Number(draft.price) - Number(draft.discount || 0),
          pricePerSqft: draft.pricePerSqft || Math.round(draft.price / 1200),
          maintenance: draft.maintenance,
          bookingAmount: draft.bookingAmount,
          discount: draft.discount,
          image: thumb(draft.name || pj.name, 44),
          amenities: draft.amenities
        });
        auditService.log('Created property', 'Properties', 'Property #' + rec.id);
        notificationService.add({ type: 'property', title: 'New property published', desc: rec.projectName + ' — ' + rec.name, link: '#/' + State.role + '/properties' });
        close();
        Toast.show('Property published', 'success', rec.projectName + ' — ' + rec.name);
        navigate('properties');
        renderView();
      });
    }
  });
}

/* ---- Manager assign --------------------------------------------- */
function openManagerAssign(managerId) {
  const leads = leadService.all().filter(l => l.managerId !== managerId);
  const props = propertyService.all().filter(p => p.managerId !== managerId);
  Modal.open({
    title: 'Assign Work to ' + userName(managerId),
    subtitle: 'Move leads or properties to this manager.',
    size: 'lg',
    body: '<div class="tabs" style="margin-bottom:16px">' +
      '<button class="tab active">Leads (' + leads.length + ')</button><button class="tab">Properties (' + props.length + ')</button></div>' +
      '<div style="max-height:340px;overflow-y:auto">' + (leads.length ? leads.slice(0, 20).map(l =>
        '<label class="check" style="justify-content:space-between;width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:11px;margin-bottom:8px">' +
        '<span><b class="small">' + esc(customerName(l.customerId)) + '</b><br><span class="tiny soft">' + esc(l.id) + ' · ' + esc(STAGE_LABEL[l.status]) + ' · currently ' + esc(userName(l.managerId)) + '</span></span>' +
        '<input type="checkbox" data-assign-lead="' + l.id + '"></label>').join('')
        : '<p class="muted small">No unassigned leads available.</p>') + '</div>',
    actions: '<button class="btn outline" data-modal-close>Cancel</button><button class="btn primary" id="ma-save">Assign Selected</button>',
    onMount: (wrap, close) => {
      wrap.querySelector('#ma-save').addEventListener('click', () => {
        let n = 0;
        wrap.querySelectorAll('[data-assign-lead]:checked').forEach(cb => {
          const lid = cb.dataset.assignLead;
          const l = leadService.byId(lid);
          if (l) { leadService.update(lid, { managerId: managerId }); customerService.update(l.customerId, { managerId: managerId }); n++; }
        });
        if (n) {
          auditService.log('Assigned leads', 'Leads', n + ' leads → ' + userName(managerId));
          notificationService.add({ type: 'lead', title: n + ' leads assigned to ' + userName(managerId), desc: 'Workload reassigned by admin', link: '#/admin/managers' });
          Toast.show(n + ' lead(s) assigned', 'success', 'To ' + userName(managerId));
        } else Toast.show('No leads selected', 'warning');
        close(); renderView();
      });
    }
  });
}

/* ---- Simple text form (amenity, location, CMS) ------------------ */
function openSimpleForm(title, fields, onSave) {
  Modal.open({
    title: title,
    size: 'sm',
    body: fields.map(f => '<div class="field"><label for="sf-' + f.key + '">' + esc(f.label) + '</label>' +
      (f.type === 'textarea'
        ? '<textarea class="textarea" id="sf-' + f.key + '">' + esc(f.value || '') + '</textarea>'
        : '<input class="input" id="sf-' + f.key + '" type="' + (f.type || 'text') + '" value="' + esc(f.value || '') + '">') + '</div>').join(''),
    actions: '<button class="btn outline" data-modal-close>Cancel</button><button class="btn primary" id="sf-save">Save</button>',
    onMount: (wrap, close) => {
      wrap.querySelector('#sf-save').addEventListener('click', () => {
        const out = {};
        fields.forEach(f => { const el = wrap.querySelector('#sf-' + f.key); if (el) out[f.key] = el.value; });
        close();
        if (onSave) onSave(out);
      });
    }
  });
}

        Toast.show('Manager added', 'success', o.name); renderView();
      }),
      'upload-doc': () => openSimpleForm('Upload Document', [
        { key: 'name', label: 'Document Name', value: 'Agreement.pdf' },
        { key: 'category', label: 'Category', value: 'Property Documents' },
        { key: 'entityName', label: 'Related To', value: 'Skyline Residency' }
      ], (o) => {
        documentService.create({ name: o.name, category: o.category, entityId: 'PR001', entityName: o.entityName, uploadedBy: State.user.id });
        auditService.log('Uploaded document', 'Documents', o.name);
        Toast.show('Document uploaded', 'success'); renderView();
      }),
      'upload-media': () => openSimpleForm('Upload Media', [
        { key: 'filename', label: 'File Name', value: 'project-banner.jpg' },
        { key: 'folder', label: 'Folder', value: 'Projects' }
      ], (o) => {
        mediaService.create({ filename: o.filename, folder: o.folder });
        auditService.log('Uploaded media', 'Media', o.filename);
        Toast.show('Media uploaded', 'success'); renderView();
      }),
      'add-location': () => openSimpleForm('Add Location', [
        { key: 'locality', label: 'Locality' }, { key: 'city', label: 'City' },
        { key: 'state', label: 'State', value: 'Uttar Pradesh' }, { key: 'pincode', label: 'Pincode' }
      ], (o) => {
        if (!o.city) { Toast.show('City is required', 'error'); return; }
        DB.data.locations.push({ id: uid('LOC', DB.data.locations.length + 1), country: 'India', state: o.state, city: o.city, locality: o.locality, pincode: o.pincode, mapUrl: 'https://maps.google.com/?q=' + encodeURIComponent(o.locality + ' ' + o.city) });
        DB.save(); Toast.show('Location added', 'success'); renderView();
      }),
      'add-amenity': () => openSimpleForm('Add Amenity', [{ key: 'name', label: 'Amenity Name' }], (o) => {
        if (!o.name) { Toast.show('Name is required', 'error'); return; }
        DB.data.amenities.push({ id: uid('AMN', DB.data.amenities.length + 1), name: o.name, icon: 'star', order: DB.data.amenities.length + 1, active: true });
        DB.save(); Toast.show('Amenity added', 'success'); renderView();
      }),
      'add-cms': () => openSimpleForm('Add CMS Section', [
        { key: 'section', label: 'Section' }, { key: 'heading', label: 'Heading' },
        { key: 'description', label: 'Description', type: 'textarea' }
      ], (o) => {
        DB.data.cms.push({ id: uid('CMS', DB.data.cms.length + 1), section: o.section, heading: o.heading, subheading: 'Custom Section', description: o.description, cta: 'Learn More', image: thumb(o.section || 'CMS', 50), status: 'draft', updatedAt: todayISO() });
        DB.save(); Toast.show('Section added', 'success'); renderView();
      }),
      'export-report': () => exportCSV('estatex-report', [
        { label: 'Metric', key: 'metric' }, { label: 'Value', key: 'value' }
      ], [
        { metric: 'Total Properties', value: propertyService.all().length },
        { metric: 'Available Units', value: propertyService.all().filter(p => p.status === 'available').length },
        { metric: 'Total Leads', value: leadService.all().length },
        { metric: 'Bookings', value: leadService.all().filter(l => l.status === 'booked').length },
        { metric: 'Verified Collection', value: paymentService.all().filter(p => p.status === 'verified').reduce((s, p) => s + p.amount, 0) },
        { metric: 'Pending Payments', value: paymentService.all().filter(p => p.status === 'pending').reduce((s, p) => s + p.amount, 0) },
        { metric: 'Site Visits', value: siteVisitService.all().length }
      ]),
      'export-audit': () => exportCSV('audit-logs', [
        { label: 'Date', key: 'at' }, { label: 'User', key: 'userName' }, { label: 'Role', key: 'role' },
        { label: 'Action', key: 'action' }, { label: 'Module', key: 'module' }, { label: 'Record', key: 'record' },
        { label: 'IP', key: 'ip' }, { label: 'Status', key: 'status' }
      ], auditService.all()),
      'mark-all-read': () => {
        notificationService.markAllRead();
        auditService.log('Marked notifications read', 'Notifications', 'All notifications');
        Toast.show('All notifications marked as read', 'success');
        renderView();
      },
      'reset-demo': () => Modal.confirm({
        title: 'Reset all demo data?',
        message: 'This restores the original fictional dataset and deletes any changes you made in this browser. This cannot be undone.',
        confirmText: 'Reset everything',
        danger: true,
        onConfirm: () => {
          DB.reset();
          State.tables = {};
          State.filters = {};
          applyTheme();
          Toast.show('Demo data reset', 'success', 'All modules restored to defaults');
          renderView();
        }
      }),
      'save-company': () => {
        const s = settingsService.get();
        s.company.name = $('#co-name').value;
        s.company.address = $('#co-address').value;
        s.company.phone = $('#co-phone').value;
        s.company.email = $('#co-email').value;
        s.company.website = $('#co-web').value;
        s.company.gstin = $('#co-gst').value;
        s.company.rera = $('#co-rera').value;
        DB.save();
        auditService.log('Updated company settings', 'Settings', 'Company profile');
        Toast.show('Company settings saved', 'success');
      },
      'save-receipt': () => {
        const s = settingsService.get();
        s.receipt.prefix = $('#rc-prefix').value;
        s.receipt.startNumber = Number($('#rc-start').value || 1);
        s.receipt.footer = $('#rc-footer').value;
        s.receipt.signature = $('#rc-sign').value;
        DB.save();
        auditService.log('Updated receipt settings', 'Settings', 'Receipt configuration');
        Toast.show('Receipt settings saved', 'success');
      },
      'preview-receipt': () => {
        const r = receiptService.all()[0];
        if (!r) { Toast.show('No receipts available yet', 'warning', 'Verify a payment first'); return; }
        openReceiptModal(r.id);
      },
      'cancel-settings': () => renderView(),
      'save-profile': () => {
        const u = authService.user(State.user.id);
        u.name = $('#pf-name').value || u.name;
        u.phone = $('#pf-phone').value || u.phone;
        u.avatar = initials(u.name);
        State.user.name = u.name;
        DB.save();
        Toast.show('Profile updated', 'success');
        renderShell();
      }
    };
    if (map[d.act]) { e.preventDefault(); map[d.act](); return; }
  }

  /* quick action buttons inside dashboard */
  if (d.quick) {
    const m = { property: openPropertyWizard, lead: openLeadForm, customer: openCustomerForm, visit: openSiteVisitForm, payment: openPaymentForm };
    if (m[d.quick]) m[d.quick]();
    return;
  }

  /* pipeline stage click → filter leads */
  if (d.gotoLead) {
    State.filters.leadStatus = d.gotoLead;
    navigate('leads');
    return;
  }

  if (d.leadView) { navigate('leads', d.leadView); return; }
  if (d.leadEdit) { openLeadForm(d.leadEdit); return; }
  if (d.leadAssign) { openLeadAssign(d.leadAssign); return; }
  if (d.leadStatus) { openLeadStage(d.leadStatus); return; }
  if (d.leadNote) { openLeadNote(d.leadNote); return; }
  if (d.leadFollowup) { openFollowUp(d.leadFollowup); return; }
  if (d.leadFollowupDone) {
    const l = leadService.byId(d.leadFollowupDone);
    if (l) {
      leadService.update(l.id, { followUpDate: addDays(7) });
      l.activities = l.activities || [];
      l.activities.unshift({ at: todayISO(), text: 'Follow-up completed, next scheduled in 7 days', by: State.user.name });
      DB.save();
      auditService.log('Completed follow-up', 'Leads', 'Lead #' + l.id);
      Toast.show('Follow-up completed', 'success', 'Next follow-up in 7 days');
      renderView();
    }
    return;
  }

  if (d.visitAdd) { openSiteVisitForm(d.visitAdd); return; }
  if (d.visitView) { navigate('sitevisits', d.visitView); return; }
  if (d.visitStatus) { openVisitStatus(d.visitStatus); return; }
  if (d.visitDel) {
    Modal.confirm({ title: 'Delete site visit?', message: 'This will permanently remove the visit record.', confirmText: 'Delete', danger: true,
      onConfirm: () => { siteVisitService.remove(d.visitDel); Toast.show('Visit deleted', 'success'); renderView(); } });
    return;
  }

  if (d.propView) { navigate('properties', d.propView); return; }
  if (d.propEdit) {
    const p = propertyService.byId(d.propEdit);
    if (!p) return;
    openSimpleForm('Edit Property — ' + p.name, [
      { key: 'name', label: 'Unit Name', value: p.name },
      { key: 'type', label: 'Type', value: p.type },
      { key: 'area', label: 'Area (sq.ft)', type: 'number', value: p.area },
      { key: 'price', label: 'Price (₹)', type: 'number', value: p.price },
      { key: 'status', label: 'Status (available/reserved/sold)', value: p.status }
    ], (o) => {
      propertyService.update(p.id, { name: o.name, type: o.type, area: Number(o.area), price: Number(o.price), pricePerSqft: Math.round(Number(o.price) / Math.max(1, Number(o.area))), status: o.status });
      auditService.log('Updated property', 'Properties', 'Property #' + p.id);
      Toast.show('Property updated', 'success');
      renderView();
    });
    return;
  }
  if (d.propAssign) { openPropertyAssign(d.propAssign); return; }
  if (d.propStatus) {
    const [pid, st] = d.propStatus.split('::');
    propertyService.update(pid, { status: st });
    auditService.log('Updated property status', 'Properties', 'Property #' + pid);
    notificationService.add({ type: 'property', title: 'Property marked ' + st, desc: propertyName(pid), link: '#/' + State.role + '/properties' });
    Toast.show('Property marked ' + st, 'success');
    renderView();
    return;
  }
  if (d.propDel) {
    Modal.confirm({ title: 'Delete property?', message: 'This permanently removes the unit from inventory. Linked leads and payments will remain but lose their property reference.', confirmText: 'Delete property', danger: true,
      onConfirm: () => { propertyService.remove(d.propDel); auditService.log('Deleted property', 'Properties', 'Property #' + d.propDel); Toast.show('Property deleted', 'success'); renderView(); } });
    return;
  }

  if (d.payView) { navigate('payments', d.payView); return; }
  if (d.payVerify) { verifyPayment(d.payVerify); return; }
  if (d.payDel) {
    Modal.confirm({ title: 'Delete payment?', message: 'This removes the transaction record permanently. Receipts already issued will be invalidated.', confirmText: 'Delete', danger: true,
      onConfirm: () => { paymentService.remove(d.payDel); Toast.show('Payment deleted', 'success'); renderView(); } });
    return;
  }
  if (d.payAdd) {
    const [cid, pid] = d.payAdd.split('::');
    openPaymentForm(cid, pid);
    return;
  }
  if (d.receipt || d.receiptPrint) { openReceiptModal(d.receipt || d.receiptPrint); return; }

  if (d.custView) { navigate('customers', d.custView); return; }
  if (d.custEdit) { openCustomerForm(d.custEdit); return; }

  if (d.mgrView) { navigate('managers', d.mgrView); return; }
  if (d.mgrEdit) { openManagerEdit(d.mgrEdit); return; }
  if (d.mgrAssign) { openManagerAssign(d.mgrAssign); return; }
  if (d.mgrPerf) { navigate('managers', d.mgrPerf); return; }

  if (d.projectView) { navigate('projects', d.projectView); return; }

  if (d.call) {
    const c = customerService.byId(d.call) || {};
    Toast.show('Calling ' + (c.name || 'customer'), 'info', c.phone || '');
    return;
  }
  if (d.wa) {
    const c = customerService.byId(d.wa) || {};
    Toast.show('Opening WhatsApp', 'info', 'Chat with ' + (c.name || 'customer'));
    return;
  }

  if (d.docView) { Toast.show('Document preview', 'info', 'Preview is not available in this prototype'); return; }
  if (d.docDl) { Toast.show('Download simulated', 'success', 'Connect a file store to enable downloads'); return; }
  if (d.docDel) {
    Modal.confirm({ title: 'Delete document?', message: 'The file record will be removed permanently.', confirmText: 'Delete', danger: true,
      onConfirm: () => { documentService.remove(d.docDel); Toast.show('Document deleted', 'success'); renderView(); } });
    return;
  }

  if (d.mediaCopy) {
    const m = mediaService.all().find(x => x.id === d.mediaCopy);
    if (m && navigator.clipboard) navigator.clipboard.writeText(m.url).then(() => Toast.show('URL copied', 'success'));
    else Toast.show('URL copied (simulated)', 'success');
    return;
  }
  if (d.mediaView) { Toast.show('Media preview', 'info', 'Open in the media library to inspect'); return; }
  if (d.mediaDel) {
    Modal.confirm({ title: 'Delete media?', message: 'This asset will be removed from the library.', confirmText: 'Delete', danger: true,
      onConfirm: () => { mediaService.remove(d.mediaDel); Toast.show('Media deleted', 'success'); renderView(); } });
    return;
  }

  if (d.amenityEdit) {
    const a = DB.data.amenities.find(x => x.id === d.amenityEdit);
    if (!a) return;
    openSimpleForm('Rename Amenity', [{ key: 'name', label: 'Name', value: a.name }], (o) => {
      a.name = o.name; DB.save(); Toast.show('Amenity updated', 'success'); renderView();
    });
    return;
  }
  if (d.amenityDel) {
    Modal.confirm({ title: 'Delete amenity?', message: 'This amenity will no longer be selectable in the property wizard.', confirmText: 'Delete', danger: true,
      onConfirm: () => { DB.data.amenities = DB.data.amenities.filter(x => x.id !== d.amenityDel); DB.save(); Toast.show('Amenity deleted', 'success'); renderView(); } });
    return;
  }

  if (d.cmsToggle) {
    const c = repo().cms.find(x => x.id === d.cmsToggle);
    if (c) { cmsService.update(c.id, { status: c.status === 'published' ? 'draft' : 'published' }); Toast.show('Status updated', 'success'); renderView(); }
    return;
  }
  if (d.cmsEdit) {
    const c = repo().cms.find(x => x.id === d.cmsEdit);
    if (!c) return;
    openSimpleForm('Edit CMS — ' + c.section, [
      { key: 'heading', label: 'Heading', value: c.heading },
      { key: 'description', label: 'Description', type: 'textarea', value: c.description },
      { key: 'cta', label: 'CTA Text', value: c.cta }
    ], (o) => { cmsService.update(c.id, o); Toast.show('CMS section updated', 'success'); renderView(); });
    return;
  }

  if (d.notif) {
    notificationService.markRead(d.notif);
    if (d.link) location.hash = d.link.replace('#/', '#/');
    renderView();
    return;
  }

  if (d.themeSet) {
    settingsService.get().appearance.theme = d.themeSet;
    DB.save(); applyTheme();
    Toast.show('Theme updated', 'success', d.themeSet === 'dark' ? 'Dark mode enabled' : 'Light mode enabled');
    renderView();
    return;
  }
});

/* Delegated change handler for settings checkboxes / selects */
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.setBoolean) {
    const path = el.dataset.setBoolean.split('.');
    const s = settingsService.get();
    if (path.length === 2) { s[path[0]][path[1]] = el.checked; DB.save(); Toast.show('Preference saved', 'success'); }
    return;
  }
  if (el.dataset && el.dataset.set) {
    const path = el.dataset.set.split('.');
    const s = settingsService.get();
    if (path.length === 2) { s[path[0]][path[1]] = el.value; DB.save(); Toast.show('Setting saved', 'success'); }
    return;
  }
  if (el.dataset && el.dataset.mgrPerm) {
    const u = authService.user(el.dataset.mgrPerm);
    if (u) {
      u.canRecordPayment = el.checked;
      DB.save();
      auditService.log('Updated manager permission', 'Managers', 'Manager #' + u.id);
      Toast.show('Permission updated', 'success', u.name + (el.checked ? ' can now record payments' : ' can no longer record payments'));
      if (State.role === 'manager' && State.user.id === u.id) renderShell();
    }
    return;
  }
  if (el.dataset && el.dataset.dfilter) {
    /* handled by bindView listeners, kept here as fallback */
  }
});

/* Toggle table/card view for properties */
document.addEventListener('click', (e) => {
  const b = e.target.closest('#prop-view-toggle');
  if (!b) return;
  State.filters.propView = (State.filters.propView === 'cards') ? 'table' : 'cards';
  renderView();
});

/* Property / lead print helpers */
function printPropertyDetail(id) {
  const p = propertyService.byId(id);
  if (!p) return;
  const comp = settingsService.get().company;
  printHTML('<div class="receipt">' +
    '<div class="rc-head"><div class="rc-brand"><div class="rc-glyph">EX</div><div><h2>' + esc(comp.name) + '</h2>' +
    '<div style="font-size:11.5px;color:#6C6862">' + esc(comp.address) + '</div></div></div>' +
    '<div class="rc-meta"><b>PROPERTY DETAILS</b>' + esc(p.id) + '<br>' + fmtDate(todayISO()) + '</div></div>' +
    '<div class="rc-sec"><h4>Unit Information</h4><table><tbody>' +
    '<tr><td>Unit</td><td><b>' + esc(p.name) + '</b></td></tr>' +
    '<tr><td>Project</td><td>' + esc(p.projectName) + '</td></tr>' +
    '<tr><td>Type</td><td>' + esc(p.type) + '</td></tr>' +
    '<tr><td>Location</td><td>' + esc(p.location) + '</td></tr>' +
    '<tr><td>Carpet Area</td><td>' + p.area + ' sq.ft</td></tr>' +
    '<tr><td>Price</td><td>' + money(p.price) + '</td></tr>' +
    '<tr><td>Price / sq.ft</td><td>' + money(p.pricePerSqft) + '</td></tr>' +
    '<tr><td>Status</td><td>' + esc(p.status.toUpperCase()) + '</td></tr>' +
    '<tr><td>Assigned Manager</td><td>' + esc(userName(p.managerId)) + '</td></tr>' +
    '</tbody></table></div>' +
    '<div class="rc-foot"><div>Generated from Estatex prototype. Demo data only.</div>' +
    '<div class="rc-sign"><div class="line">Authorised Signatory</div></div></div></div>');
}

/* ==================================================================
   50. KEYBOARD SHORTCUTS
   ================================================================== */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeAllMenus();
    if (Modal.stack.length) Modal.close();
  }
  /* ⌘K / Ctrl+K focuses global search */
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    const s = $('#global-search');
    if (s) s.focus();
  }
});

/* ==================================================================
   51. RESIZE HANDLING
   ================================================================== */
window.addEventListener('resize', debounce(() => {
  if (!State.user) return;
  const mt = $('#mobile-toggle');
  if (mt) mt.style.display = window.innerWidth <= 768 ? 'grid' : 'none';
  if (window.innerWidth > 768 && State.mobileOpen) { State.mobileOpen = false; renderShell(); }
}, 220));

/* ==================================================================
   52. INIT
   ================================================================== */
(function init() {
  DB.load();
  applyTheme();
  const restored = authService.restore();
  if (restored) {
    State.user = restored;
    State.role = restored.role;
    const r = parseHash();
    if (r) { State.page = r.page; State.detailId = r.id; }
    else { location.hash = '#/' + State.role + '/dashboard'; }
    renderShell();
    window.addEventListener('hashchange', onRoute);
  } else {
    renderLogin();
  }
  /* Seed a helpful console note for developers */
  console.info('%cEstatex — Real Estate Management Suite (Prototype)', 'font-weight:bold;color:#A9823C');
  console.info('Frontend role-based access is simulated. Production authorisation must be enforced server-side.');
})();
</script>
