<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Estatex — Premium Real Estate Management Suite (Frontend Prototype)">
<title>Estatex — Real Estate Management Suite</title>
<style>
/* ============================================================
   DESIGN SYSTEM
   ============================================================ */
:root{
  --bg:#F6F5F2; --surface:#FFFFFF; --surface-2:#FAF9F6; --surface-3:#F1EFEA;
  --text:#1A1917; --text-muted:#6C6862; --text-soft:#948F86;
  --border:#E6E2DA; --border-strong:#D8D3C8;
  --accent:#A9823C; --accent-2:#8A6A2E; --accent-soft:#F5EFE3; --accent-ink:#4A3818;
  --success:#2E7D5B; --success-soft:#E8F3EE;
  --warning:#B4761A; --warning-soft:#FBF1DF;
  --danger:#B23F35; --danger-soft:#FBEBE9;
  --info:#3B6FA0; --info-soft:#EAF1F8;
  --radius:16px; --radius-sm:10px; --radius-lg:22px;
  --shadow-sm:0 1px 2px rgba(26,25,23,.05);
  --shadow:0 1px 2px rgba(26,25,23,.04), 0 10px 30px -14px rgba(26,25,23,.18);
  --shadow-lg:0 24px 60px -24px rgba(26,25,23,.30);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --sidebar-w:266px; --sidebar-wc:78px; --topbar-h:70px;
}
[data-theme="dark"]{
  --bg:#131210; --surface:#1C1B17; --surface-2:#22211C; --surface-3:#2A2823;
  --text:#F2F0EA; --text-muted:#A9A49A; --text-soft:#7C776E;
  --border:#302E28; --border-strong:#3D3A33;
  --accent:#C9A15C; --accent-soft:#2C2519; --accent-ink:#F0E4CC;
  --success:#4FA97F; --success-soft:#1B2A23;
  --warning:#D9A445; --warning-soft:#2B2318;
  --danger:#D96A5E; --danger-soft:#2C1D1B;
  --info:#6FA3D4; --info-soft:#182430;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -24px rgba(0,0,0,.75);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); font-size:14px; line-height:1.55;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
h1,h2,h3,h4,h5{margin:0;font-weight:650;letter-spacing:-.015em}
p{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-soft)}

/* ============================================================
   LOGIN
   ============================================================ */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:var(--surface)}
.login-aside{
  position:relative;overflow:hidden;padding:56px;
  background:linear-gradient(150deg,#23211B 0%,#141310 60%,#1E1B14 100%);
  color:#F4F1EA;display:flex;flex-direction:column;justify-content:space-between;
}
.login-aside::before{
  content:'';position:absolute;width:640px;height:640px;right:-220px;top:-200px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,161,92,.30),transparent 65%);
}
.login-aside::after{
  content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:56px 56px;mask-image:radial-gradient(circle at 70% 40%,#000,transparent 78%);
}
.login-aside>*{position:relative;z-index:1}
.brandmark{display:flex;align-items:center;gap:12px}
.brandmark .glyph{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(140deg,#C9A15C,#8A6A2E);color:#1A1508;font-weight:800;font-size:19px;letter-spacing:-.05em;
  box-shadow:0 8px 24px -8px rgba(201,161,92,.8)
}
.brandmark .bname{font-size:19px;font-weight:700;letter-spacing:-.03em}
.brandmark .btag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,241,234,.55)}
.login-hero h1{font-size:clamp(30px,3.2vw,44px);line-height:1.12;font-weight:680;letter-spacing:-.035em;max-width:15ch}
.login-hero p{margin-top:18px;color:rgba(244,241,234,.66);max-width:46ch;font-size:15px;line-height:1.7}
.login-stats{display:flex;gap:38px;flex-wrap:wrap}
.login-stats .ls{display:flex;flex-direction:column;gap:2px}
.login-stats b{font-size:23px;font-weight:680;letter-spacing:-.03em;color:#E8D5AC}
.login-stats span{font-size:11.5px;color:rgba(244,241,234,.5);letter-spacing:.06em;text-transform:uppercase}
.login-main{display:grid;place-items:center;padding:40px 28px;background:var(--surface)}
.login-card{width:100%;max-width:412px;animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.login-card h2{font-size:26px;letter-spacing:-.03em}
.login-card .sub{color:var(--text-muted);margin-top:7px;font-size:13.5px}
.role-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-3);padding:5px;border-radius:13px;margin:26px 0 22px}
.role-switch button{
  padding:10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-muted);
  transition:.18s;display:flex;align-items:center;justify-content:center;gap:8px
}
.role-switch button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:7px;letter-spacing:.01em}
.input,.select,.textarea{
  width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);transition:.16s;font-size:14px
}
.input:hover,.select:hover,.textarea:hover{border-color:var(--border-strong)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft)}
.textarea{resize:vertical;min-height:84px}
.select{appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236C6862' stroke-width='2' stroke-linecap='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:44px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px;border-radius:8px;color:var(--text-soft)}
.pw-toggle:hover{color:var(--text);background:var(--surface-3)}
.login-row{display:flex;align-items:center;justify-content:space-between;margin:4px 0 22px;font-size:13px}
.check{display:flex;align-items:center;gap:8px;color:var(--text-muted);cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.link{color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}
.demo-hint{
  margin-top:22px;padding:13px 15px;border-radius:12px;background:var(--surface-2);
  border:1px dashed var(--border-strong);font-size:12.5px;color:var(--text-muted);line-height:1.75
}
.demo-hint b{color:var(--text)}
.demo-hint code{background:var(--surface-3);padding:1px 6px;border-radius:5px;font-size:12px}
.alert-error{
  background:var(--danger-soft);color:var(--danger);border-radius:11px;padding:11px 14px;
  font-size:13px;margin-bottom:16px;display:flex;gap:9px;align-items:center;font-weight:500
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 15px;border-radius:11px;font-size:13.5px;font-weight:600;letter-spacing:-.005em;
  border:1px solid transparent;transition:.16s;white-space:nowrap;line-height:1.3
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--text);color:var(--surface)}
.btn.primary:hover{background:#000;transform:translateY(-1px);box-shadow:var(--shadow)}
[data-theme="dark"] .btn.primary{background:var(--accent);color:#1A1508}
[data-theme="dark"] .btn.primary:hover{background:#DDB56C}
.btn.gold{background:linear-gradient(140deg,#C9A15C,#A9823C);color:#1A1508}
.btn.gold:hover{transform:translateY(-1px);box-shadow:0 10px 24px -12px rgba(169,130,60,.9)}
.btn.outline{border-color:var(--border-strong);background:var(--surface);color:var(--text)}
.btn.outline:hover{border-color:var(--text-soft);background:var(--surface-2)}
.btn.ghost{color:var(--text-muted)}
.btn.ghost:hover{background:var(--surface-3);color:var(--text)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.icon{padding:8px;border-radius:10px}
.btn.block{width:100%}
.btn.loading{position:relative;color:transparent!important;pointer-events:none}
.btn.loading::after{
  content:'';position:absolute;width:15px;height:15px;border-radius:50%;
  border:2px solid currentColor;border-top-color:transparent;animation:spin .7s linear infinite;
  color:var(--surface)
}
.btn.outline.loading::after{color:var(--text)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:60;
  transition:width .26s cubic-bezier(.2,.7,.3,1),transform .26s cubic-bezier(.2,.7,.3,1)
}
.app.collapsed .sidebar{width:var(--sidebar-wc)}
.sb-head{height:var(--topbar-h);display:flex;align-items:center;gap:11px;padding:0 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.app.collapsed .sb-head{padding:0;justify-content:center}
.sb-head .glyph{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(140deg,#C9A15C,#8A6A2E);color:#1A1508;font-weight:800;font-size:16px;letter-spacing:-.05em
}
.sb-head .txt{overflow:hidden;white-space:nowrap}
.sb-head .txt b{display:block;font-size:15.5px;letter-spacing:-.03em;font-weight:700}
.sb-head .txt span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-soft)}
.app.collapsed .sb-head .txt{display:none}
.sb-nav{flex:1;overflow-y:auto;padding:14px 12px 8px}
.app.collapsed .sb-nav{padding:14px 10px 8px}
.sb-section{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-soft);padding:16px 12px 7px;font-weight:700}
.app.collapsed .sb-section{text-align:center;padding:12px 0 6px;font-size:9px;letter-spacing:.06em;overflow:hidden}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:9.5px 12px;border-radius:11px;
  color:var(--text-muted);font-size:13.5px;font-weight:550;transition:.15s;position:relative;cursor:pointer;margin-bottom:1px
}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:650}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--accent)}
.app.collapsed .nav-item{justify-content:center;padding:10px}
.app.collapsed .nav-item .lbl,.app.collapsed .nav-item .nbadge{display:none}
.app.collapsed .nav-item.active::before{left:-10px}
.nav-item .ic{flex-shrink:0}
.nav-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbadge{
  background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;min-width:19px;height:19px;
  border-radius:99px;display:grid;place-items:center;padding:0 5px
}
.nbadge.gold{background:var(--accent);color:#1A1508}
.sb-foot{padding:12px;border-top:1px solid var(--border);flex-shrink:0}
.app.collapsed .sb-foot{padding:10px}
.collapse-btn{
  position:absolute;right:-13px;top:86px;width:26px;height:26px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;
  color:var(--text-muted);box-shadow:var(--shadow-sm);z-index:70;transition:.15s
}
.collapse-btn:hover{color:var(--text);border-color:var(--border-strong);transform:scale(1.08)}
.main{flex:1;margin-left:var(--sidebar-w);transition:margin-left .26s cubic-bezier(.2,.7,.3,1);min-width:0;display:flex;flex-direction:column}
.app.collapsed .main{margin-left:var(--sidebar-wc)}

/* Topbar */
.topbar{
  height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 26px;position:sticky;top:0;z-index:50
}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);flex-shrink:0;min-width:0}
.breadcrumb b{color:var(--text);font-weight:650}
.breadcrumb .sep{color:var(--text-soft)}
.gsearch{flex:1;max-width:420px;position:relative;margin-left:auto}
.gsearch .input{padding-left:38px;background:var(--surface-2);border-color:transparent;height:40px}
.gsearch .input:focus{background:var(--surface);border-color:var(--accent)}
.gsearch .sic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-soft);pointer-events:none}
.search-results{
  position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow-lg);max-height:440px;overflow-y:auto;padding:8px;z-index:80;
  animation:drop .16s ease both
}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sr-group{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-soft);padding:10px 10px 5px;font-weight:700}
.sr-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:.13s}
.sr-item:hover{background:var(--surface-3)}
.sr-item .sic2{width:32px;height:32px;border-radius:9px;background:var(--surface-3);display:grid;place-items:center;color:var(--text-muted);flex-shrink:0}
.sr-item .stx{min-width:0}
.sr-item .stx b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-item .stx span{font-size:11.5px;color:var(--text-soft)}
.top-actions{display:flex;align-items:center;gap:9px;flex-shrink:0}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--text-muted);
  transition:.15s;position:relative
}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.dot-badge{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
.user-chip{display:flex;align-items:center;gap:10px;padding:5px 11px 5px 5px;border-radius:99px;transition:.15s;border:1px solid transparent}
.user-chip:hover{background:var(--surface-2);border-color:var(--border)}
.avatar{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(140deg,#C9A15C,#8A6A2E);color:#1A1508;font-weight:700;font-size:12.5px;letter-spacing:-.02em
}
.avatar.sm{width:29px;height:29px;font-size:11px}
.avatar.lg{width:64px;height:64px;font-size:22px;border-radius:19px}
.avatar.grey{background:var(--surface-3);color:var(--text-muted)}
.user-chip .un{font-size:13px;font-weight:620;line-height:1.25}
.user-chip .ur{font-size:10px;color:var(--text-soft);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.menu{
  position:absolute;top:calc(100% + 8px);right:0;min-width:218px;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:7px;z-index:90;
  animation:drop .16s ease both
}
.menu-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:13.5px;color:var(--text-muted);transition:.13s;width:100%;text-align:left;font-weight:550}
.menu-item:hover{background:var(--surface-3);color:var(--text)}
.menu-item.danger{color:var(--danger)}
.menu-item.danger:hover{background:var(--danger-soft)}
.menu-sep{height:1px;background:var(--border);margin:6px 8px}
.menu-head{padding:9px 11px 7px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-soft);font-weight:700}
.pos-rel{position:relative}

/* Content */
.content{padding:26px 30px 60px;flex:1;max-width:1560px;width:100%}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.page-head .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:7px}
.page-head h1{font-size:26px;letter-spacing:-.035em;font-weight:680}
.page-head .sub{color:var(--text-muted);font-size:13.5px;margin-top:6px;max-width:62ch}
.head-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.card.pad{padding:22px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-head h3{font-size:15px;letter-spacing:-.02em;font-weight:660}
.card-head .csub{font-size:12.5px;color:var(--text-muted);margin-top:3px}
.card-body{padding:22px}
.card-body.tight{padding:16px}
.grid{display:grid;gap:18px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}

/* KPI */
.kpi{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:19px 20px;
  box-shadow:var(--shadow-sm);transition:.2s;position:relative;overflow:hidden
}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.kpi .ktop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.kpi .kicon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2)}
.kpi .kicon.green{background:var(--success-soft);color:var(--success)}
.kpi .kicon.blue{background:var(--info-soft);color:var(--info)}
.kpi .kicon.amber{background:var(--warning-soft);color:var(--warning)}
.kpi .kicon.red{background:var(--danger-soft);color:var(--danger)}
.kpi .klabel{font-size:12px;color:var(--text-muted);font-weight:600;letter-spacing:.01em}
.kpi .kval{font-size:26px;font-weight:690;letter-spacing:-.04em;margin-top:5px;line-height:1.15}
.kpi .kfoot{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:12px;color:var(--text-soft);flex-wrap:wrap}
.trend{display:inline-flex;align-items:center;gap:4px;font-weight:680;font-size:12px}
.trend.up{color:var(--success)}
.trend.down{color:var(--danger)}
.kpi .kmeta{font-size:11px;color:var(--text-soft)}

/* Badges */
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3.5px 9px;border-radius:7px;
  font-size:11.5px;font-weight:650;letter-spacing:.01em;white-space:nowrap;line-height:1.5
}
.badge.green{background:var(--success-soft);color:var(--success)}
.badge.amber{background:var(--warning-soft);color:var(--warning)}
.badge.red{background:var(--danger-soft);color:var(--danger)}
.badge.blue{background:var(--info-soft);color:var(--info)}
.badge.gold{background:var(--accent-soft);color:var(--accent-2)}
.badge.grey{background:var(--surface-3);color:var(--text-muted)}
.badge.dot::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}

/* Tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.data{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
table.data thead th{
  text-align:left;padding:12px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-soft);font-weight:700;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;position:relative
}
table.data thead th.sortable{cursor:pointer;user-select:none;transition:.14s}
table.data thead th.sortable:hover{color:var(--text)}
table.data thead th .sarrow{opacity:.35;margin-left:5px;font-size:10px}
table.data thead th.sorted .sarrow{opacity:1;color:var(--accent)}
table.data tbody td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
table.data tbody tr{transition:.13s}
table.data tbody tr:hover{background:var(--surface-2)}
table.data tbody tr:last-child td{border-bottom:none}
table.data td.num{font-variant-numeric:tabular-nums;font-weight:620}
.cell-main{font-weight:620;letter-spacing:-.01em}
.cell-sub{font-size:12px;color:var(--text-soft);margin-top:2px}
.cell-flex{display:flex;align-items:center;gap:11px;min-width:0}
.thumb{width:48px;height:38px;border-radius:9px;object-fit:cover;flex-shrink:0;border:1px solid var(--border);background:var(--surface-3)}
.row-actions{display:flex;gap:4px;align-items:center}
.act-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--text-soft);transition:.14s}
.act-btn:hover{background:var(--surface-3);color:var(--text)}
.act-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.pagination{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.page-info{font-size:12.5px;color:var(--text-muted)}
.page-btns{display:flex;gap:5px;align-items:center}
.page-btn{
  min-width:32px;height:32px;padding:0 9px;border-radius:9px;display:grid;place-items:center;
  font-size:13px;font-weight:600;color:var(--text-muted);transition:.14s;border:1px solid transparent
}
.page-btn:hover:not(:disabled){background:var(--surface-3);color:var(--text)}
.page-btn.active{background:var(--text);color:var(--surface)}
[data-theme="dark"] .page-btn.active{background:var(--accent);color:#1A1508}
.page-btn:disabled{opacity:.35;cursor:not-allowed}

/* Toolbar / Filters */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar .input,.toolbar .select{height:40px;min-width:150px}
.toolbar .search{flex:1;min-width:220px;max-width:380px;position:relative}
.toolbar .search .input{padding-left:37px;width:100%}
.toolbar .search .sic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-soft);pointer-events:none}
.filter-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chip{
  padding:6px 13px;border-radius:99px;font-size:12.5px;font-weight:600;border:1px solid var(--border);
  background:var(--surface);color:var(--text-muted);transition:.15s
}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip.active{background:var(--text);color:var(--surface);border-color:var(--text)}
[data-theme="dark"] .chip.active{background:var(--accent);color:#1A1508;border-color:var(--accent)}

/* Empty / Skeleton */
.empty{padding:56px 24px;text-align:center}
.empty .eic{width:58px;height:58px;border-radius:17px;background:var(--surface-3);color:var(--text-soft);display:grid;place-items:center;margin:0 auto 16px}
.empty h4{font-size:15.5px;font-weight:650}
.empty p{color:var(--text-muted);font-size:13px;margin-top:6px;max-width:38ch;margin-inline:auto}
.skel{background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 50%,var(--surface-3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-line{height:12px;margin-bottom:10px}

/* Progress */
.prog{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s cubic-bezier(.2,.7,.3,1)}
.prog.green i{background:var(--success)}
.prog.blue i{background:var(--info)}

/* Pipeline */
.pipeline{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:11px}
.pstage{
  background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:15px;
  transition:.2s;cursor:pointer;position:relative;overflow:hidden
}
.pstage:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.pstage .pname{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-soft);font-weight:700}
.pstage .pcount{font-size:24px;font-weight:690;letter-spacing:-.04em;margin-top:9px}
.pstage .pmeta{font-size:11.5px;color:var(--text-muted);margin-top:3px;display:flex;align-items:center;gap:6px}
.pstage .pbar{height:4px;border-radius:99px;background:var(--surface-3);margin-top:12px;overflow:hidden}
.pstage .pbar i{display:block;height:100%;border-radius:99px;background:var(--accent)}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(7,minmax(230px,1fr));gap:14px;overflow-x:auto;padding-bottom:12px}
.kcol{background:var(--surface-2);border:1px solid var(--border);border-radius:15px;display:flex;flex-direction:column;min-height:220px}
.kcol-head{padding:14px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.kcol-head .kh-l{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted)}
.kcol-head .kh-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.kcol-head .kh-count{background:var(--surface);border:1px solid var(--border);border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px;color:var(--text-muted)}
.kcol-body{padding:10px;display:flex;flex-direction:column;gap:9px;flex:1;min-height:90px;transition:.15s}
.kcol-body.over{background:var(--accent-soft);border-radius:0 0 14px 14px}
.kcard{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:grab;
  transition:.16s;box-shadow:var(--shadow-sm)
}
.kcard:hover{border-color:var(--border-strong);transform:translateY(-1px);box-shadow:var(--shadow)}
.kcard.dragging{opacity:.45;cursor:grabbing}
.kcard .kcname{font-size:13.5px;font-weight:660;letter-spacing:-.015em}
.kcard .kcprop{font-size:11.5px;color:var(--text-muted);margin-top:4px;display:flex;align-items:center;gap:5px}
.kcard .kcfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--border)}
.kcard .kcamt{font-size:12.5px;font-weight:680;letter-spacing:-.02em}
.kcard .kcdate{font-size:11px;color:var(--text-soft)}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,18,14,.55);backdrop-filter:blur(4px);z-index:200;
  display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;
  animation:fade .18s ease both
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:600px;
  box-shadow:var(--shadow-lg);animation:pop .22s cubic-bezier(.2,.8,.3,1) both;margin:auto;
  border:1px solid var(--border);overflow:hidden
}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.modal.lg{max-width:840px}
.modal.xl{max-width:1060px}
.modal.sm{max-width:440px}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 24px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:17px;letter-spacing:-.025em;font-weight:680}
.modal-head .msub{font-size:13px;color:var(--text-muted);margin-top:5px}
.modal-body{padding:24px;max-height:calc(100vh - 260px);overflow-y:auto}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:17px 24px;border-top:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap}
.modal-foot.between{justify-content:space-between}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.form-grid.three{grid-template-columns:repeat(3,1fr)}
.form-grid .full{grid-column:1/-1}
.help{font-size:11.5px;color:var(--text-soft);margin-top:5px}

/* Steps */
.steps{display:flex;gap:4px;overflow-x:auto;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.step{
  display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;
  color:var(--text-soft);white-space:nowrap;transition:.15s
}
.step .sn{width:20px;height:20px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:11px;font-weight:700}
.step.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.step.active .sn{background:var(--accent);color:#1A1508}
.step.done .sn{background:var(--success);color:#fff}
.step.done{color:var(--success)}

/* Checklist */
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
.check-tile{
  display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:11px;border:1px solid var(--border);
  font-size:13px;font-weight:550;cursor:pointer;transition:.15s;background:var(--surface)
}
.check-tile:hover{border-color:var(--border-strong)}
.check-tile.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:620}
.check-tile .box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border-strong);display:grid;place-items:center;flex-shrink:0}
.check-tile.on .box{background:var(--accent);border-color:var(--accent);color:#1A1508}

/* Dropzone */
.dropzone{
  border:2px dashed var(--border-strong);border-radius:14px;padding:34px 20px;text-align:center;
  transition:.18s;cursor:pointer;background:var(--surface-2)
}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone .dzic{width:46px;height:46px;border-radius:14px;background:var(--surface);display:grid;place-items:center;margin:0 auto 13px;color:var(--accent)}
.dropzone b{font-size:13.5px;font-weight:650;display:block}
.dropzone span{font-size:12px;color:var(--text-soft);display:block;margin-top:4px}

/* Media grid */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:15px}
.media-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:.18s}
.media-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.media-card img{width:100%;height:118px;object-fit:cover;display:block;background:var(--surface-3)}
.media-card .mcinfo{padding:11px 13px}
.media-card .mcinfo b{font-size:12.5px;font-weight:620;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-card .mcinfo span{font-size:11px;color:var(--text-soft)}
.media-card .mcacts{display:flex;gap:2px;padding:0 8px 8px}

/* Property cards */
.prop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:19px}
.prop-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  transition:.2s;display:flex;flex-direction:column
}
.prop-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.prop-card .pcimg{height:172px;position:relative;background:var(--surface-3);overflow:hidden}
.prop-card .pcimg img{width:100%;height:100%;object-fit:cover;display:block}
.prop-card .pcbadge{position:absolute;top:12px;left:12px}
.prop-card .pcprice{
  position:absolute;bottom:12px;right:12px;background:rgba(20,18,14,.82);color:#fff;
  padding:6px 12px;border-radius:9px;font-size:13.5px;font-weight:680;backdrop-filter:blur(6px);letter-spacing:-.02em
}
.prop-card .pcbody{padding:17px;flex:1;display:flex;flex-direction:column;gap:11px}
.prop-card .pcbody h4{font-size:15px;letter-spacing:-.025em;font-weight:660}
.prop-card .pcmeta{font-size:12.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.prop-card .pcstats{display:flex;gap:16px;padding-top:12px;border-top:1px solid var(--border);margin-top:auto}
.prop-card .pcstat b{display:block;font-size:13.5px;font-weight:660;letter-spacing:-.02em}
.prop-card .pcstat span{font-size:10.5px;color:var(--text-soft);letter-spacing:.06em;text-transform:uppercase}

/* Detail page */
.detail-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;margin-bottom:22px}
.hero-img{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);background:var(--surface-3);aspect-ratio:16/10}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}
.thumbs img{width:100%;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--border);cursor:pointer;transition:.15s}
.thumbs img:hover{border-color:var(--accent);transform:translateY(-2px)}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:19px}
.dl .dt{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-soft);font-weight:700;margin-bottom:5px}
.dl .dd{font-size:14.5px;font-weight:620;letter-spacing:-.015em}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--border);overflow-x:auto;margin-bottom:20px}
.tab{
  padding:11px 16px;font-size:13.5px;font-weight:600;color:var(--text-muted);position:relative;
  white-space:nowrap;transition:.15s;border-radius:9px 9px 0 0
}
.tab:hover{color:var(--text);background:var(--surface-2)}
.tab.active{color:var(--text)}
.tab.active::after{content:'';position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}

/* Timeline */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:1.5px;background:var(--border)}
.tl-item{position:relative;padding-bottom:19px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{
  content:'';position:absolute;left:-22px;top:5px;width:11px;height:11px;border-radius:50%;
  background:var(--surface);border:2px solid var(--border-strong)
}
.tl-item.gold::before{border-color:var(--accent);background:var(--accent)}
.tl-item.green::before{border-color:var(--success);background:var(--success)}
.tl-item .tlt{font-size:13.5px;font-weight:620;letter-spacing:-.01em}
.tl-item .tld{font-size:11.5px;color:var(--text-soft);margin-top:2px}
.tl-item .tlb{font-size:12.5px;color:var(--text-muted);margin-top:5px}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:400;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{
  background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px 16px;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;min-width:290px;max-width:390px;
  animation:slideIn .28s cubic-bezier(.2,.8,.3,1) both;pointer-events:auto;border-left:3px solid var(--accent)
}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast.out{animation:slideOut .22s ease forwards}
@keyframes slideOut{to{opacity:0;transform:translateX(40px)}}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}
.toast .tic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.toast.success .tic{background:var(--success-soft);color:var(--success)}
.toast.error .tic{background:var(--danger-soft);color:var(--danger)}
.toast.warning .tic{background:var(--warning-soft);color:var(--warning)}
.toast .tmsg{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.toast .tsub{font-size:12px;color:var(--text-soft);margin-top:1px}

/* Charts */
.chart-wrap{position:relative;width:100%}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}
.chart-legend .cl{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-muted);font-weight:550}
.chart-legend .cld{width:10px;height:10px;border-radius:3px}
#chart-tip{
  position:fixed;background:var(--text);color:var(--surface);padding:7px 11px;border-radius:9px;
  font-size:12px;font-weight:600;pointer-events:none;z-index:500;display:none;white-space:nowrap;
  box-shadow:var(--shadow-lg);letter-spacing:-.01em
}
.bar-rect{transition:.16s;cursor:pointer}
.bar-rect:hover{opacity:.82}

/* Notification list */
.notif-item{display:flex;gap:14px;padding:15px 20px;border-bottom:1px solid var(--border);transition:.15s;cursor:pointer}
.notif-item:hover{background:var(--surface-2)}
.notif-item.unread{background:var(--accent-soft)}
.notif-item.unread:hover{background:#F0E7D6}
[data-theme="dark"] .notif-item.unread:hover{background:#332B1C}
.notif-item .nic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:var(--surface-3);color:var(--text-muted)}
.notif-item .nbody{flex:1;min-width:0}
.notif-item .nt{font-size:13.5px;font-weight:620;letter-spacing:-.01em}
.notif-item .nd{font-size:12.5px;color:var(--text-muted);margin-top:3px}
.notif-item .ntime{font-size:11.5px;color:var(--text-soft);white-space:nowrap}

/* Receipt */
.receipt{
  background:#fff;color:#1A1917;padding:40px;border-radius:14px;border:1px solid #E6E2DA;
  font-size:13px;line-height:1.6;max-width:800px;margin:0 auto
}
.receipt .rc-head{display:flex;justify-content:space-between;gap:24px;padding-bottom:22px;border-bottom:2px solid #1A1917}
.receipt .rc-brand{display:flex;gap:13px;align-items:flex-start}
.receipt .rc-glyph{width:46px;height:46px;border-radius:12px;background:linear-gradient(140deg,#C9A15C,#8A6A2E);color:#1A1508;display:grid;place-items:center;font-weight:800;font-size:19px}
.receipt h2{font-size:19px;letter-spacing:-.03em}
.receipt .rc-meta{text-align:right;font-size:12px;color:#6C6862;line-height:1.75}
.receipt .rc-meta b{display:block;font-size:16px;color:#1A1917;letter-spacing:-.02em;margin-bottom:3px}
.receipt .rc-sec{margin-top:24px}
.receipt .rc-sec h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#948F86;margin-bottom:10px;font-weight:700}
.receipt table{width:100%;border-collapse:collapse;font-size:13px}
.receipt table th{text-align:left;padding:9px 0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#948F86;border-bottom:1px solid #E6E2DA;font-weight:700}
.receipt table td{padding:11px 0;border-bottom:1px solid #F1EFEA}
.receipt table td:last-child,.receipt table th:last-child{text-align:right}
.receipt .rc-total td{font-weight:700;font-size:14.5px;border-bottom:none;border-top:2px solid #1A1917}
.receipt .rc-foot{margin-top:30px;padding-top:20px;border-top:1px dashed #D8D3C8;display:flex;justify-content:space-between;gap:24px;font-size:11.5px;color:#6C6862}
.receipt .rc-sign{text-align:right}
.receipt .rc-sign .line{margin-top:36px;border-top:1px solid #1A1917;width:170px;padding-top:6px;font-weight:600;color:#1A1917}

/* Print */
#print-area{display:none}
@media print{
  body{background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important;padding:0}
  .receipt{border:none;padding:24px;max-width:100%;box-shadow:none}
  @page{size:A4;margin:14mm}
}

/* Utilities */
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.gap-6{gap:6px}.gap-10{gap:10px}.gap-14{gap:14px}
.mt-8{margin-top:8px}.mt-14{margin-top:14px}.mt-20{margin-top:20px}.mt-26{margin-top:26px}
.mb-0{margin-bottom:0}.mb-14{margin-bottom:14px}.mb-20{margin-bottom:20px}
.muted{color:var(--text-muted)}.soft{color:var(--text-soft)}
.tiny{font-size:11.5px}.small{font-size:12.5px}
.bold{font-weight:660}.mono{font-variant-numeric:tabular-nums}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidden{display:none!important}
.text-right{text-align:right}
.divider{height:1px;background:var(--border);margin:18px 0}
.pill-note{
  display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.1em;

/* ==================================================================
   5. LOCAL STORAGE
   ================================================================== */
const DB = {
  data: null,
  load() {
    try {
      const raw = localStorage.getItem(CONFIG.storageKey);
      if (raw) { this.data = JSON.parse(raw); return this.data; }
    } catch (e) { console.warn('[Estatex] Failed to read local storage, reseeding.', e); }
    this.data = seedData();
    this.save();
    return this.data;
  },
  save() {
    try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(this.data)); }
    catch (e) { console.warn('[Estatex] Persist failed', e); }
  },
  reset() {
    this.data = seedData();
    this.save();
  }
};

const repo = () => DB.data;

const authService = {
  login(email, password) {
    const u = repo().users.find(x => x.email.toLowerCase() === String(email).toLowerCase().trim());
    if (!u) return { ok: false, error: 'No account found with that email address.' };
    if (u.password !== password) return { ok: false, error: 'Incorrect password. Please try again.' };
    const session = { id: u.id, name: u.name, email: u.email, role: u.role, avatar: u.avatar, at: Date.now() };
    try { localStorage.setItem(CONFIG.sessionKey, JSON.stringify(session)); } catch (e) {}
    return { ok: true, user: u };
  },
  logout() { try { localStorage.removeItem(CONFIG.sessionKey); } catch (e) {} },
  restore() {
    try {
      const raw = localStorage.getItem(CONFIG.sessionKey);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return repo().users.find(u => u.id === s.id) || null;
    } catch (e) { return null; }
  },
  user(id) { return repo().users.find(u => u.id === id) || null; }
};

const propertyService = {
  all() { return repo().properties; },
  byId(id) { return repo().properties.find(p => p.id === id) || null; },
  create(data) {
    const list = repo().properties;
    const id = uid('PR', list.length + 1);
    const rec = Object.assign({ id, enquiries: 0, createdAt: todayISO(), status: 'available' }, data);
    const pj = repo().projects.find(x => x.id === rec.projectId);
    if (pj) { rec.projectName = pj.name; rec.location = rec.location || (pj.locality + ', ' + pj.city); rec.image = rec.image || thumb(pj.name + ' ' + rec.unitNumber, 40); }
    list.unshift(rec); DB.save(); return rec;
  },
  update(id, patch) {
    const p = this.byId(id); if (!p) return null;
    Object.assign(p, patch); DB.save(); return p;
  },
  remove(id) {
    DB.data.properties = repo().properties.filter(p => p.id !== id); DB.save();
  },
  forManager(mid) { return repo().properties.filter(p => p.managerId === mid); }
};

const paymentService = {
  all() { return repo().payments; },
  byId(id) { return repo().payments.find(p => p.id === id) || null; },
  create(data) {
    const id = uid('PAY', repo().payments.length + 1);
    const rec = Object.assign({ id, status: 'pending', receiptNo: null, verifiedBy: null, date: todayISO() }, data);
    repo().payments.unshift(rec); DB.save(); return rec;
  },
  verify(id, byUserId) {
    const p = this.byId(id); if (!p) return null;
    p.status = 'verified';
    p.verifiedBy = byUserId;
    if (!p.receiptNo) p.receiptNo = CONFIG.receipt.prefix + pad(1001 + repo().payments.filter(x => x.receiptNo).length, 4);
    DB.save(); return p;
  },
  reject(id, byUserId) { const p = this.byId(id); if (p) { p.status = 'rejected'; p.verifiedBy = byUserId; DB.save(); } return p; },
  remove(id) { DB.data.payments = repo().payments.filter(p => p.id !== id); DB.save(); },

function getManagerData(managerId) {
  const leads = leadService.forManager(managerId);
  const propertyIds = new Set(leads.map(l => l.propertyId));
  const customerIds = new Set(leads.map(l => l.customerId));
  const properties = propertyService.forManager(managerId);
  const siteVisits = siteVisitService.forManager(managerId);
  const payments = paymentService.forManager(managerId);
  const customers = repo().customers.filter(c => c.managerId === managerId || customerIds.has(c.id));

      leads: leads.length,
      customers: customers.length,

      bookings: leads.filter(l => l.status === 'booked').length,
      collection: payments.filter(p => p.status === 'verified').reduce((s, p) => s + p.amount, 0)
    }

}
/* Returns the dataset the current user is allowed to see */

      siteVisits: siteVisitService.all(), payments: paymentService.all(), receipts: receiptService.all(),

/* ==================================================================

   ================================================================== */
const Modal = {
  stack: [],
  open(opts) {
    const root = $('#modal-root');
    const wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    const sizeClass = opts.size ? ' ' + opts.size : '';
    wrap.innerHTML =
      '<div class="modal' + sizeClass + '" role="dialog" aria-modal="true" aria-label="' + esc(opts.title || 'Dialog') + '">' +
        '<div class="modal-head">' +
          '<div><h3>' + esc(opts.title || '') + '</h3>' + (opts.subtitle ? '<div class="msub">' + esc(opts.subtitle) + '</div>' : '') + '</div>' +
          '<button class="icon-btn" data-modal-close aria-label="Close dialog">' + icon('x', 18) + '</button>' +
        '</div>' +
        '<div class="modal-body">' + (opts.body || '') + '</div>' +
        (opts.actions ? '<div class="modal-foot' + (opts.footClass ? ' ' + opts.footClass : '') + '">' + opts.actions + '</div>' : '') +
      '</div>';
    root.appendChild(wrap);
    this.stack.push(wrap);

    const close = () => this.close(wrap);
    wrap.querySelectorAll('[data-modal-close]').forEach(b => b.addEventListener('click', close));
    wrap.addEventListener('mousedown', (e) => { if (e.target === wrap && opts.dismissible !== false) close(); });
    wrap.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

    const focusable = wrap.querySelector('input,select,textarea,button');
    if (focusable) setTimeout(() => focusable.focus(), 40);

    if (opts.onMount) opts.onMount(wrap, close);
    return { el: wrap, close };
  },
  close(wrap) {
    if (!wrap) wrap = this.stack[this.stack.length - 1];
    if (!wrap) return;
    wrap.style.animation = 'fade .15s reverse both';
    setTimeout(() => {
      wrap.remove();
      this.stack = this.stack.filter(w => w !== wrap);
    }, 140);
  },
  closeAll() { this.stack.slice().forEach(w => this.close(w)); },
  confirm(opts) {
    return this.open({
      title: opts.title || 'Confirm action',
      subtitle: opts.subtitle,
      size: 'sm',
      body: '<p style="color:var(--text-muted);font-size:14px;line-height:1.7">' + esc(opts.message || '') + '</p>' +
        (opts.extra || ''),
      actions:
        '<button class="btn outline" data-modal-close>' + esc(opts.cancelText || 'Cancel') + '</button>' +
        '<button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" id="modal-confirm">' + esc(opts.confirmText || 'Confirm') + '</button>',
      onMount: (wrap, close) => {
        wrap.querySelector('#modal-confirm').addEventListener('click', () => {
          close();
          if (opts.onConfirm) opts.onConfirm();
        });
      }
    });
  }
};

/* ==================================================================
   13. TABLE COMPONENT
   ================================================================== */
function tblState(id, defaults) {
  if (!State.tables[id]) State.tables[id] = Object.assign({ page: 1, sortKey: null, sortDir: 'asc', q: '' }, defaults || {});
  return State.tables[id];
}

function dataTable(id, columns, rows, opts) {
  opts = opts || {};
  const st = tblState(id, opts.state);
  let data = rows.slice();

  /* search */
  const q = (st.q || '').trim().toLowerCase();
  if (q && opts.searchKeys) {
    data = data.filter(r => opts.searchKeys.some(k => String(r[k] == null ? '' : r[k]).toLowerCase().includes(q)));
  }
  /* extra filter fn */
  if (opts.filterFn) data = data.filter(opts.filterFn);

  /* sort */
  if (st.sortKey) {
    const dir = st.sortDir === 'asc' ? 1 : -1;
    data.sort((a, b) => {
      const av = a[st.sortKey], bv = b[st.sortKey];
      if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * dir;
      return String(av == null ? '' : av).localeCompare(String(bv == null ? '' : bv)) * dir;
    });
  }

  const pageSize = opts.pageSize || 8;
  const total = data.length;
  const pages = Math.max(1, Math.ceil(total / pageSize));
  if (st.page > pages) st.page = pages;
  const start = (st.page - 1) * pageSize;
  const slice = data.slice(start, start + pageSize);

  if (total === 0) {
    return '<div class="empty">' +
      '<div class="eic">' + icon(opts.emptyIcon || 'search', 24) + '</div>' +
      '<h4>' + esc(opts.emptyTitle || 'No records found') + '</h4>' +
      '<p>' + esc(opts.emptyText || 'Try changing your filters or add a new record.') + '</p>' +
      (opts.emptyAction ? '<div class="mt-20">' + opts.emptyAction + '</div>' : '') +
      '</div>';
  }

  let html = '<div class="table-wrap"><table class="data"><thead><tr>';
  columns.forEach(c => {
    const sorted = st.sortKey === c.key;
    html += '<th class="' + (c.sortable !== false ? 'sortable' : '') + (sorted ? ' sorted' : '') + '"' +
      (c.sortable !== false ? ' data-sort="' + esc(c.key) + '" data-tbl="' + id + '"' : '') +
      (c.width ? ' style="width:' + c.width + '"' : '') + '>' + esc(c.label) +
      (c.sortable !== false ? '<span class="sarrow">' + (sorted ? (st.sortDir === 'asc' ? '▲' : '▼') : '↕') + '</span>' : '') +
      '</th>';
  });
  html += '</tr></thead><tbody>';

  slice.forEach((row, i) => {
    html += '<tr data-tbl-row="' + id + '" data-row-index="' + (start + i) + '"' +
      (opts.rowId ? ' data-id="' + esc(row[opts.rowId]) + '"' : '') + '>';
    columns.forEach(c => {
      html += '<td class="' + (c.cls || '') + '">' + (c.render ? c.render(row, start + i) : esc(row[c.key])) + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  /* pagination */
  const from = start + 1, to = Math.min(start + pageSize, total);
  html += '<div class="pagination"><div class="page-info">Showing <b>' + from + '–' + to + '</b> of <b>' + total + '</b> records</div><div class="page-btns">';
  html += '<button class="page-btn" data-tbl-page="' + id + '" data-page="' + (st.page - 1) + '"' + (st.page === 1 ? ' disabled' : '') + ' aria-label="Previous page">' + icon('chevLeft', 15) + '</button>';
  const win = [];
  for (let p = 1; p <= pages; p++) {
    if (p === 1 || p === pages || Math.abs(p - st.page) <= 1) win.push(p);
    else if (win[win.length - 1] !== '...') win.push('...');
  }
  win.forEach(p => {
    if (p === '...') html += '<span class="page-btn" style="pointer-events:none">…</span>';
    else html += '<button class="page-btn' + (p === st.page ? ' active' : '') + '" data-tbl-page="' + id + '" data-page="' + p + '">' + p + '</button>';
  });
  html += '<button class="page-btn" data-tbl-page="' + id + '" data-page="' + (st.page + 1) + '"' + (st.page === pages ? ' disabled' : '') + ' aria-label="Next page">' + icon('chevRight', 15) + '</button>';
  html += '</div></div>';

  return html;
}

function searchBox(tableId, placeholder, value) {
  return '<div class="search">' + '<span class="sic">' + icon('search', 16) + '</span>' +
    '<input class="input" type="search" id="ts-' + tableId + '" data-tbl-search="' + tableId + '" placeholder="' + esc(placeholder) + '" value="' + esc(value || '') + '" aria-label="' + esc(placeholder) + '">' +
    '</div>';
}

/* ==================================================================
   14. CHART COMPONENTS (vanilla SVG)
   ================================================================== */
function barChart(data, opts) {
  opts = opts || {};
  const w = 100, h = opts.height || 220;
  const max = Math.max.apply(null, data.map(d => d.value)) || 1;
  const padL = 8, padR = 8, padT = 16, padB = 30;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const bw = innerW / data.length * 0.52;
  let svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="width:100%;height:' + h + 'px;overflow:visible" role="img" aria-label="' + esc(opts.label || 'Bar chart') + '">';
  /* gridlines */
  for (let g = 0; g <= 4; g++) {
    const y = padT + (innerH / 4) * g;
    svg += '<line x1="0" y1="' + y + '" x2="' + w + '" y2="' + y + '" stroke="var(--border)" stroke-width="0.35" stroke-dasharray="2 2.5"/>';
  }
  data.forEach((d, i) => {
    const x = padL + (innerW / data.length) * i + (innerW / data.length - bw) / 2;
    const bh = (d.value / max) * innerH;
    const y = padT + innerH - bh;
    svg += '<rect class="bar-rect" x="' + x + '" y="' + y + '" width="' + bw + '" height="' + Math.max(bh, 1) + '" rx="2" fill="' + (d.color || 'var(--accent)') + '" data-tip="' + esc(d.label + ': ' + (opts.tipFormat ? opts.tipFormat(d.value) : d.value)) + '"></rect>';
    svg += '<text x="' + (x + bw / 2) + '" y="' + (h - 9) + '" font-size="6.5" font-family="Inter,sans-serif" font-weight="600" fill="var(--text-soft)" text-anchor="middle">' + esc(d.label) + '</text>';
  });
  svg += '</svg>';
  return svg;
}

function lineChart(data, opts) {
  opts = opts || {};
  const w = 600, h = opts.height || 230;
  const padL = 46, padR = 16, padT = 18, padB = 34;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const max = Math.max.apply(null, data.map(d => d.value)) * 1.15 || 1;
  const pts = data.map((d, i) => ({
    x: padL + (innerW / Math.max(1, data.length - 1)) * i,
    y: padT + innerH - (d.value / max) * innerH,
    d: d
  }));
  let path = '';
  pts.forEach((p, i) => { path += (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ' '; });
  const area = path + 'L' + pts[pts.length - 1].x.toFixed(1) + ' ' + (padT + innerH) + ' L' + pts[0].x.toFixed(1) + ' ' + (padT + innerH) + ' Z';

  let svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;overflow:visible" role="img" aria-label="' + esc(opts.label || 'Line chart') + '">';
  svg += '<defs><linearGradient id="lg-' + (opts.gid || 'a') + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity="0.28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>';
  for (let g = 0; g <= 4; g++) {
    const y = padT + (innerH / 4) * g;
    const val = max - (max / 4) * g;
    svg += '<line x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"/>';
    svg += '<text x="' + (padL - 9) + '" y="' + (y + 4) + '" font-size="10" font-family="Inter,sans-serif" fill="var(--text-soft)" text-anchor="end">' + (opts.yFormat ? opts.yFormat(val) : Math.round(val)) + '</text>';
  }
  svg += '<path d="' + area + '" fill="url(#lg-' + (opts.gid || 'a') + ')"/>';
  svg += '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>';
  pts.forEach(p => {
    svg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="4.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.4" style="cursor:pointer" data-tip="' + esc(p.d.label + ': ' + (opts.tipFormat ? opts.tipFormat(p.d.value) : p.d.value)) + '"/>';
    svg += '<text x="' + p.x.toFixed(1) + '" y="' + (h - 10) + '" font-size="10.5" font-family="Inter,sans-serif" font-weight="600" fill="var(--text-soft)" text-anchor="middle">' + esc(p.d.label) + '</text>';
  });
  svg += '</svg>';
  return svg;
}

function donutChart(segments, opts) {
  opts = opts || {};
  const size = opts.size || 190, r = 62, cx = size / 2, cy = size / 2, sw = 20;
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  const circ = 2 * Math.PI * r;
  let offset = 0;
  let svg = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="' + esc(opts.label || 'Donut chart') + '">';
  svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--surface-3)" stroke-width="' + sw + '"/>';
  segments.forEach(s => {
    const len = (s.value / total) * circ;
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + s.color + '" stroke-width="' + sw + '" stroke-dasharray="' + len.toFixed(2) + ' ' + (circ - len).toFixed(2) + '" stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')" stroke-linecap="butt" style="cursor:pointer" data-tip="' + esc(s.label + ': ' + s.value) + '"/>';
    offset += len;
  });
  svg += '<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" font-size="24" font-weight="700" font-family="Inter,sans-serif" fill="var(--text)" letter-spacing="-0.03em">' + (opts.centerValue || total) + '</text>';
  svg += '<text x="' + cx + '" y="' + (cy + 17) + '" text-anchor="middle" font-size="10.5" font-weight="600" font-family="Inter,sans-serif" fill="var(--text-soft)" letter-spacing="0.08em">' + esc(opts.centerLabel || 'TOTAL') + '</text>';
  svg += '</svg>';
  return svg;
}

function hBarChart(items, opts) {
  opts = opts || {};
  const max = Math.max.apply(null, items.map(i => i.value)) || 1;
  return '<div style="display:flex;flex-direction:column;gap:14px">' + items.map(i =>
    '<div><div class="flex between center" style="margin-bottom:6px">' +
      '<span style="font-size:13px;font-weight:600">' + esc(i.label) + '</span>' +
      '<span style="font-size:13px;font-weight:680;letter-spacing:-.02em">' + esc(opts.format ? opts.format(i.value) : i.value) + '</span>' +
    '</div><div class="prog ' + (i.cls || '') + '" style="height:7px"><i style="width:' + ((i.value / max) * 100).toFixed(1) + '%"></i></div></div>'
  ).join('') + '</div>';
}

  tip.textContent = t.getAttribute('data-tip');
  tip.style.display = 'block';
  let x = e.clientX + 14, y = e.clientY - 34;
  if (x + tip.offsetWidth > window.innerWidth - 10) x = e.clientX - tip.offsetWidth - 14;
  if (y < 8) y = e.clientY + 18;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
});

/* ==================================================================
   15. CSV EXPORT
   ================================================================== */
function exportCSV(filename, columns, rows) {
  const esc1 = (v) => {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const head = columns.map(c => esc1(c.label)).join(',');
  const body = rows.map(r => columns.map(c => esc1(typeof c.value === 'function' ? c.value(r) : r[c.key])).join(',')).join('\n');
  const csv = '\uFEFF' + head + '\n' + body;
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename + '-' + todayISO() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  Toast.show('Export ready', 'success', filename + '.csv downloaded');
}

function parseHash() {
  const raw = (location.hash || '').replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  if (parts.length === 0) return null;
  return { panel: parts[0], page: parts[1] || 'dashboard', id: parts[2] || null };
}

function navigate(page, id) {
  const h = '#/' + State.role + '/' + page + (id ? '/' + id : '');
  if (location.hash === h) { State.page = page; State.detailId = id; renderShell(); }
  else location.hash = h;
}

function onRoute() {
  const r = parseHash();
  if (!r) { location.hash = '#/' + (State.role || 'admin') + '/dashboard'; return; }
  if (State.role && r.panel !== State.role) { location.hash = '#/' + State.role + '/dashboard'; return; }
  State.page = r.page;
  State.detailId = r.id;
  State.mobileOpen = false;
  renderShell();
}

      html += '<div class="sr-group">' + label + ' <span style="opacity:.6">(' + items.length + ')</span></div>';
      items.forEach(it => {
        html += '<div class="sr-item" data-goto="' + nav(it) + '"><div class="sic2">' + icon(render(it).ic, 16) + '</div>' +
          '<div class="stx"><b>' + esc(render(it).t) + '</b><span>' + esc(render(it).s) + '</span></div></div>';
      });
    };
    group('Properties', props, p => ({ ic: 'building', t: p.projectName + ' — ' + p.name, s: p.type + ' · ' + p.location + ' · ' + moneyShort(p.price) }), p => '#/' + State.role + '/properties/' + p.id);
    group('Projects', projs, p => ({ ic: 'layers', t: p.name, s: p.city + ' · ' + p.totalUnits + ' units · ' + moneyShort(p.startingPrice) + '+' }), p => '#/' + State.role + '/projects/' + p.id);
    group('Leads', lds, l => ({ ic: 'users', t: customerName(l.customerId) + ' · ' + l.id, s: STAGE_LABEL[l.status] + ' · ' + moneyShort(l.budget) + ' · ' + l.source }), l => '#/' + State.role + '/leads/' + l.id);
    group('Customers', cus, c => ({ ic: 'user', t: c.name, s: c.phone + ' · ' + c.city }), c => '#/' + State.role + '/customers/' + c.id);
    group('Managers', mgrs, m => ({ ic: 'userCheck', t: m.name, s: m.title + ' · ' + m.email }), m => '#/admin/managers/' + m.id);

    if (!html) html = '<div class="sr-group">No matches</div><div style="padding:14px 10px;font-size:13px;color:var(--text-muted)">Nothing found for “' + esc(input.value) + '”. Try a project, customer or phone number.</div>';
    box.innerHTML = html;
    box.style.display = 'block';
    box.querySelectorAll('[data-goto]').forEach(el => el.addEventListener('click', () => {
      location.hash = el.dataset.goto;
      input.value = '';
      box.style.display = 'none';
    }));
  };
  input.addEventListener('input', debounce(run, 180));
  input.addEventListener('focus', () => { if (input.value.trim().length >= 2) run(); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Escape') { input.value = ''; box.style.display = 'none'; } });
}

/* ==================================================================
   23. VIEW DISPATCHER
   ================================================================== */
function renderView() {
  const view = $('#view');
  if (!view) return;

  /* permission guard */
  if (!can(State.page)) {
    view.innerHTML = '<div class="empty"><div class="eic">' + icon('shield', 24) + '</div>' +
      '<h4>You don’t have access to this module</h4>' +
      '<p>Your role (' + esc(State.role) + ') is not permitted to view this page. Contact your administrator if you believe this is an error.</p>' +
      '<div class="mt-20"><button class="btn primary" onclick="navigate(\'dashboard\')">Back to Dashboard</button></div></div>';
    return;
  }

  const id = State.detailId;
  let html = '';

  /* detail routes */
  if (id) {
    if (State.page === 'properties') html = detailProperty(id);
    else if (State.page === 'leads') html = detailLead(id);
    else if (State.page === 'customers') html = detailCustomer(id);
    else if (State.page === 'managers' && State.role === 'admin') html = detailManager(id);
    else if (State.page === 'projects') html = detailProject(id);
    else if (State.page === 'payments' || State.page === 'receipts') html = detailPayment(id);
    else if (State.page === 'sitevisits') html = detailSiteVisit(id);
  }

  if (!html) {
    if (State.page === 'dashboard') html = State.role === 'admin' ? pageAdminDashboard() : pageManagerDashboard();
    else if (State.page === 'properties') html = pageProperties();
    else if (State.page === 'projects') html = pageProjects();
    else if (State.page === 'leads') html = pageLeads();
    else if (State.page === 'customers') html = pageCustomers();
    else if (State.page === 'managers') html = pageManagers();
    else if (State.page === 'payments') html = pagePayments();
    else if (State.page === 'receipts') html = pageReceipts();
    else if (State.page === 'sitevisits') html = pageSiteVisits();
    else if (State.page === 'documents') html = pageDocuments();
    else if (State.page === 'media') html = pageMedia();
    else if (State.page === 'locations') html = pageLocations();
    else if (State.page === 'amenities') html = pageAmenities();
    else if (State.page === 'reports') html = pageReports();
    else if (State.page === 'notifications') html = pageNotifications();
    else if (State.page === 'cms') html = pageCMS();
    else if (State.page === 'auditlogs') html = pageAuditLogs();
    else if (State.page === 'settings') html = pageSettings();
    else if (State.page === 'profile') html = pageProfile();
    else if (State.page === 'followups') html = pageFollowUps();
  }

  view.innerHTML = html;
  bindView(view);
}

/* Re-render helper (keeps focus on a given element id) */
function rerender(focusId) {
  renderView();
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      try { if (el.setSelectionRange && el.value != null) el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
    }
  }
}

/* ==================================================================
   24. GENERIC VIEW EVENT BINDING
   ================================================================== */
function bindView(view) {
  /* table search */
  view.querySelectorAll('[data-tbl-search]').forEach(inp => {
    inp.addEventListener('input', debounce(() => {
      const st = tblState(inp.dataset.tblSearch);
      st.q = inp.value; st.page = 1;
      rerender('ts-' + inp.dataset.tblSearch);
    }, 260));
  });
  /* table sort */
  view.querySelectorAll('[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const st = tblState(th.dataset.tbl);
      if (st.sortKey === th.dataset.sort) st.sortDir = st.sortDir === 'asc' ? 'desc' : 'asc';
      else { st.sortKey = th.dataset.sort; st.sortDir = 'asc'; }
      renderView();
    });
  });
  /* pagination */
  view.querySelectorAll('[data-tbl-page]').forEach(b => {
    b.addEventListener('click', () => {
      const st = tblState(b.dataset.tblPage);
      st.page = Number(b.dataset.page);
      renderView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
  /* filter chips */
  view.querySelectorAll('[data-filter]').forEach(c => {
    c.addEventListener('click', () => {
      const [key, val] = c.dataset.filter.split('::');
      State.filters[key] = (State.filters[key] === val) ? '' : val;
      renderView();
    });
  });
  /* generic dropdown filters */
  view.querySelectorAll('[data-dfilter]').forEach(s => {
    s.addEventListener('change', () => {
      const [key, name] = s.dataset.dfilter.split('::');
      State.filters[key] = s.value;
      renderView();
    });
  });
  /* tab bars */
  view.querySelectorAll('[data-tab]').forEach(t => {
    t.addEventListener('click', () => {
      State.tabs = State.tabs || {};
      State.tabs[t.dataset.tabGroup || 'default'] = t.dataset.tab;
      renderView();
    });
  });
  /* clickable rows */
  view.querySelectorAll('tr[data-id][data-row-link]').forEach(tr => {
    tr.style.cursor = 'pointer';
    tr.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('a')) return;
      location.hash = tr.dataset.rowLink;
    });
  });
  /* kanban drag & drop */
  view.querySelectorAll('.kcard').forEach(c => {
    c.setAttribute('draggable', 'true');
    c.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', c.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      c.classList.add('dragging');
    });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
  });
  view.querySelectorAll('.kcol-body').forEach(col => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', (e) => {
      e.preventDefault(); col.classList.remove('over');
      const id = e.dataTransfer.getData('text/plain');
      const stage = col.dataset.stage;
      if (!id || !stage) return;
      const lead = leadService.byId(id);
      if (!lead || lead.status === stage) return;
      if (State.role === 'manager' && lead.managerId !== State.user.id) {
        Toast.show('Not permitted', 'error', 'This lead is not assigned to you.');
        return;
      }
      leadService.setStatus(id, stage, State.user.name);
      auditService.log('Updated lead status', 'Leads', 'Lead #' + id);
      Toast.show('Lead moved to ' + STAGE_LABEL[stage], 'success', customerName(lead.customerId));
      renderView();
    });
  });
  /* dropzones (simulated upload) */
  view.querySelectorAll('[data-dropzone]').forEach(dz => {
    dz.addEventListener('click', () => simulateUpload(dz));
    ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('over'); }));
    dz.addEventListener('drop', (e) => { if (e.dataTransfer && e.dataTransfer.files.length) simulateUpload(dz, e.dataTransfer.files[0].name); else simulateUpload(dz); });
  });
}

function simulateUpload(dz, filename) {
  const label = dz.querySelector('[data-dz-label]');
  if (label) label.textContent = 'Uploading…';
  setTimeout(() => {
    if (label) label.textContent = filename || 'demo-upload-' + ri(100, 999) + '.jpg';
    Toast.show('Upload simulated', 'success', 'File storage is not connected in this prototype');
  }, 700);
}

/* ==================================================================
   26. DASHBOARD HELPERS
   ================================================================== */
function greeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}

function monthKeys(n) {
  const out = [];
  const d = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const x = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out.push({ key: x.toISOString().slice(0, 7), label: x.toLocaleDateString('en-IN', { month: 'short' }) });
  }
  return out;
}

function collectionSeries(months) {
  const pays = scoped().payments.filter(p => p.status === 'verified');
  return months.map(m => ({
    label: m.label,
    value: pays.filter(p => String(p.date).slice(0, 7) === m.key).reduce((s, p) => s + p.amount, 0)
  }));
}

    const neg = md.leads.filter(l => l.status === 'negotiation').length;
    const bk = md.leads.filter(l => l.status === 'booked').length;
    const conv = md.leads.length ? Math.round((bk / md.leads.length) * 100) : 0;
    html += '<tr><td>' + personCell(m.name, m.title) + '</td>' +
      '<td class="num">' + md.leads.length + '</td>' +
      '<td class="num">' + contacted + '</td>' +
      '<td class="num">' + md.siteVisits.length + '</td>' +
      '<td class="num">' + neg + '</td>' +
      '<td class="num">' + bk + '</td>' +
      '<td class="num">' + moneyShort(md.stats.collection) + '</td>' +
      '<td><div class="flex center gap-10"><div class="prog green" style="width:70px"><i style="width:' + conv + '%"></i></div><b class="small">' + conv + '%</b></div></td>' +
      '<td><button class="btn ghost sm" data-mgr-perf="' + m.id + '">View Performance</button></td></tr>';
  });
  html += '</tbody></table></div></div>';

  return html;
}

  const p = paymentService.byId(payId);
  if (!p) return;

    subtitle: 'Printable A4 receipt — use your browser print dialog to save as PDF.',

    onMount: (wrap, close) => {

      });
    }
  });
}

  let html = pageHead('My Workspace', greeting() + ', ' + State.user.name.split(' ')[0],

    kpi('My Leads', d.leads.length, d.leads.filter(l => l.status === 'new').length + ' new', 'users', 'blue') +

    kpi('Upcoming Site Visits', upcomingVisits.length, 'Next: ' + (upcomingVisits[0] ? fmtDate(upcomingVisits[0].date) : '—'), 'calendar', '') +

    '<a class="btn ghost sm" href="#/manager/followups">View all</a></div>';
  if (!todaysFollowUps.length) html += emptyState('checkCircle', 'Nothing due today', 'You have no follow-ups scheduled for today.');
  else {
    html += '<div class="table-wrap"><table class="data"><thead><tr><th>Customer</th><th>Property</th><th>Budget</th><th>Stage</th><th>Action</th></tr></thead><tbody>';
    todaysFollowUps.forEach(l => {
      html += '<tr><td>' + personCell(customerName(l.customerId), customerPhone(l.customerId)) + '</td>' +
        '<td class="truncate" style="max-width:210px">' + esc(propertyName(l.propertyId)) + '</td>' +
        '<td class="num">' + moneyShort(l.budget) + '</td><td>' + badge(l.status) + '</td>' +
        '<td><div class="row-actions">' +
          actionBtn('phone', 'Call', 'data-call="' + l.customerId + '"') +
          actionBtn('message', 'WhatsApp', 'data-wa="' + l.customerId + '"') +
          actionBtn('check', 'Mark complete', 'data-lead-followup-done="' + l.id + '"') +
          actionBtn('calendar', 'Reschedule', 'data-lead-followup="' + l.id + '"') +
        '</div></td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';

  /* pipeline */
  const stages = LEAD_STAGES.filter(s => s !== 'lost');
  html += '<div class="card mb-20"><div class="card-head"><div><h3>My Pipeline</h3><div class="csub">Drag cards to update stage</div></div></div>' +
    '<div class="card-body"><div class="kanban" style="grid-template-columns:repeat(' + stages.length + ',minmax(210px,1fr))">';
  stages.forEach(s => {
    const items = d.leads.filter(l => l.status === s);
    html += '<div class="kcol"><div class="kcol-head"><div class="kh-l"><span class="kh-dot" style="background:' + STAGE_COLOR[s] + '"></span>' + esc(STAGE_LABEL[s]) + '</div>' +
      '<span class="kh-count">' + items.length + '</span></div><div class="kcol-body" data-stage="' + s + '">';
    items.slice(0, 8).forEach(l => {
      html += '<div class="kcard" data-id="' + l.id + '"><div class="kcname">' + esc(customerName(l.customerId)) + '</div>' +
        '<div class="kcprop">' + icon('building', 11) + '<span class="truncate">' + esc(propertyName(l.propertyId)) + '</span></div>' +
        '<div class="kcfoot"><span class="kcamt">' + moneyShort(l.budget) + '</span><span class="kcdate">' + fmtDate(l.followUpDate) + '</span></div></div>';
    });
    if (!items.length) html += '<div class="tiny soft" style="text-align:center;padding:14px 4px">Empty</div>';
    html += '</div></div>';

  html += '</div></div></div>';

  /* two columns */
  html += '<div class="grid g-2 mb-20">';
  html += '<div class="card"><div class="card-head"><h3>Upcoming Site Visits</h3></div>';
  if (!upcomingVisits.length) html += emptyState('calendar', 'No upcoming visits', 'Schedule a site visit from any lead.');

  html += '</div>';

  html += '<div class="card"><div class="card-head"><h3>My Properties</h3><a class="btn ghost sm" href="#/manager/properties">View all</a></div>';
  if (!d.properties.length) html += emptyState('building', 'No properties assigned', 'Ask your admin to assign inventory.');
  else html += '<div class="card-body tight">' + d.properties.slice(0, 5).map(p =>

    '<div style="text-align:right"><div class="bold small">' + moneyShort(p.price) + '</div>' + badge(p.status) + '</div></div>').join('') + '</div>';
  html += '</div></div>';

  /* recent activity */
  html += '<div class="card"><div class="card-head"><h3>Recent Activity</h3></div><div class="card-body"><div class="timeline">' +
    d.leads.slice(0, 6).map((l, i) => '<div class="tl-item ' + (i === 0 ? 'gold' : '') + '"><div class="tlt">' + esc(customerName(l.customerId)) + ' — ' + esc(STAGE_LABEL[l.status]) + '</div>' +
      '<div class="tld">' + fmtDate(l.createdAt) + ' · ' + esc(l.source) + ' · ' + esc(propertyName(l.propertyId)) + '</div></div>').join('') +
    (d.leads.length ? '' : '<p class="muted small">No recent activity.</p>') + '</div></div></div>';
  return html;
}

/* ==================================================================

   ================================================================== */
function pageFollowUps() {
  const d = getManagerData(State.user.id);
  const today = todayISO();
  const overdue = d.leads.filter(l => l.followUpDate < today && l.status !== 'booked' && l.status !== 'lost');
  const dueToday = d.leads.filter(l => l.followUpDate === today);
  const upcoming = d.leads.filter(l => l.followUpDate > today).sort((a, b) => a.followUpDate.localeCompare(b.followUpDate));

  const rows = overdue.concat(dueToday, upcoming);

  let html = pageHead('Sales', 'Follow-ups', 'Never miss a customer touchpoint.',
    '<button class="btn outline" data-act="export-lead">' + icon('download', 16) + ' Export</button>');

  html += '<div class="grid g-3 mb-20">' +
    kpi('Overdue', overdue.length, 'Requires immediate action', 'alert', 'red') +
    kpi('Due Today', dueToday.length, 'Scheduled for today', 'clock', 'amber') +
    kpi('Upcoming', upcoming.length, 'Scheduled ahead', 'calendar', 'blue') + '</div>';

  const cols = [
    { key: 'customerId', label: 'Customer', render: l => personCell(customerName(l.customerId), customerPhone(l.customerId)) },
    { key: 'propertyId', label: 'Property', render: l => '<div class="truncate" style="max-width:210px">' + esc(propertyName(l.propertyId)) + '</div>' },
    { key: 'followUpDate', label: 'Due', render: l => '<span class="' + (l.followUpDate < today ? 'bold" style="color:var(--danger)' : 'small muted') + '">' + fmtDate(l.followUpDate) + '</span>' },
    { key: 'status', label: 'Stage', render: l => badge(l.status) },
    { key: 'budget', label: 'Budget', render: l => '<span class="num">' + moneyShort(l.budget) + '</span>' },
    { key: '_a', label: 'Action', sortable: false, render: l => '<div class="row-actions">' +
        actionBtn('phone', 'Call', 'data-call="' + l.customerId + '"') +
        actionBtn('message', 'WhatsApp', 'data-wa="' + l.customerId + '"') +

        actionBtn('calendar', 'Reschedule', 'data-lead-followup="' + l.id + '"') + '</div>' }

    pageSize: 10, rowId: 'id', searchKeys: ['followUpDate'],
    emptyIcon: 'checkCircle', emptyTitle: 'No follow-ups pending', emptyText: 'You are fully caught up. Great work.'
  }) + '</div>';
  return html;
}
