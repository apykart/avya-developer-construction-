<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AVYA Business Portal — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--black:#080808;--red:#B5121B;--white:#FFFFFF;--light:#F6F6F4;--dark:#151515;--muted:#777;--font:'Manrope',sans-serif;--shadow:0 20px 60px rgba(0,0,0,.12);--radius:8px;--transition:.35s cubic-bezier(.25,.46,.45,.94)}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--white);color:var(--black);line-height:1.6;overflow-x:hidden}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:var(--font);border:none;background:none}
ul{list-style:none}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 26px;font-weight:700;font-size:.9rem;letter-spacing:.3px;border-radius:4px;transition:var(--transition);border:2px solid transparent;justify-content:center;text-align:center}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--red);color:var(--white);border-color:var(--red)}
.btn-primary:hover{background:#9e0f17;border-color:#9e0f17;transform:translateY(-2px);box-shadow:0 12px 30px rgba(181,18,27,.3)}
.btn-outline-dark{background:transparent;color:var(--black);border-color:var(--black)}
.btn-outline-dark:hover{background:var(--black);color:var(--white)}
.btn-black{background:var(--black);color:var(--white);border-color:var(--black)}
.btn-black:hover{background:#1a1a1a;transform:translateY(-2px)}
.btn-sm{padding:6px 14px;font-size:.75rem}
.btn-xs{padding:4px 9px;font-size:.7rem;gap:5px}
.btn-success{background:#16a34a;color:#fff;border-color:#16a34a}
.btn-success:hover{background:#15803d;border-color:#15803d}
.btn-danger{background:#dc2626;color:#fff;border-color:#dc2626}
.btn-danger:hover{background:#b91c1c;border-color:#b91c1c}
.w-full{width:100%}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}
.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}

/* BOOT */
.boot{position:fixed;inset:0;background:#080808;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9000;font-weight:700;text-align:center;padding:20px}
.boot.hide{display:none}
.boot .spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* LOGIN */
.login-screen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#080808 0%,#1a1a1a 100%);position:relative;overflow:hidden}
.login-screen.active{display:flex}
.login-screen::before{content:'';position:absolute;top:-20%;right:-10%;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(181,18,27,.35),transparent 65%)}
.login-screen::after{content:'';position:absolute;bottom:-20%;left:-10%;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(181,18,27,.15),transparent 65%)}
.login-box{position:relative;z-index:2;background:var(--white);border-radius:var(--radius);padding:44px 40px;width:100%;max-width:440px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.login-box .logo{display:flex;align-items:baseline;gap:2px;font-weight:800;font-size:1.6rem;margin-bottom:6px;letter-spacing:-.5px}
.login-box .logo .red{color:var(--red)}
.login-box h2{font-size:1.3rem;font-weight:800;margin-top:14px}
.login-box .sub{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.8rem;font-weight:600;margin-bottom:6px;color:var(--black)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 16px;border:1px solid rgba(0,0,0,.08);border-radius:4px;font-family:var(--font);font-size:.95rem;transition:var(--transition);background:var(--light);color:var(--black)}
.form-group input:disabled,.form-group input[readonly]{opacity:.7;cursor:not-allowed}
.form-group textarea{resize:vertical}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--red);background:var(--white);box-shadow:0 0 0 3px rgba(181,18,27,.08)}
.login-footer{text-align:center;margin-top:16px;font-size:.85rem}
.login-footer a,.link-btn{color:var(--red);font-weight:600;cursor:pointer}
.login-footer a:hover,.link-btn:hover{text-decoration:underline}

/* SHELL */
.dashboard-shell{display:none;min-height:100vh;background:var(--light);font-family:var(--font)}
.dashboard-shell.active{display:flex}
.dash-sidebar{width:262px;background:var(--black);color:rgba(255,255,255,.7);padding:24px 0 12px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.dash-sidebar::-webkit-scrollbar{width:5px}
.dash-sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:10px}
.dash-sidebar .brand{padding:0 24px 22px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:16px}
.dash-sidebar .brand h3{font-size:1.1rem;font-weight:800;color:var(--white)}
.dash-sidebar .brand h3 .red{color:var(--red)}
.dash-sidebar .brand small{font-size:.62rem;color:var(--muted);display:block;margin-top:2px;letter-spacing:.8px}
.dash-sidebar .nav-sec{padding:10px 24px 6px;font-size:.6rem;letter-spacing:1.2px;color:rgba(255,255,255,.25);font-weight:700;text-transform:uppercase}
.dash-sidebar .nav-item{display:flex;align-items:center;gap:14px;padding:10px 24px;color:rgba(255,255,255,.5);font-weight:500;font-size:.83rem;transition:var(--transition);cursor:pointer;border-left:3px solid transparent;position:relative}
.dash-sidebar .nav-item:hover{color:var(--white);background:rgba(255,255,255,.04)}
.dash-sidebar .nav-item.active{color:var(--white);border-left-color:var(--red);background:rgba(255,255,255,.05)}
.dash-sidebar .nav-item i{width:20px;font-size:.95rem;text-align:center}
.dash-sidebar .nav-item .pill{margin-left:auto;background:var(--red);color:#fff;font-size:.6rem;font-weight:800;padding:1px 7px;border-radius:20px}
.dash-sidebar .spacer{flex:1;min-height:12px}
.dash-sidebar .back-link{margin:10px 24px 4px;padding:10px;border:1px solid rgba(255,255,255,.06);border-radius:4px;color:rgba(255,255,255,.5);text-align:center;font-weight:600;font-size:.74rem;transition:var(--transition);cursor:pointer;background:none;display:block}
.dash-sidebar .back-link:hover{border-color:var(--red);color:var(--white)}
.dash-sidebar .logout-btn{margin:8px 24px 4px;padding:11px;border:1px solid rgba(255,255,255,.06);border-radius:4px;color:rgba(255,255,255,.4);text-align:center;font-weight:600;font-size:.78rem;transition:var(--transition);cursor:pointer;background:none}
.dash-sidebar .logout-btn:hover{border-color:var(--red);color:var(--white)}
.dash-main{flex:1;padding:26px 32px 60px;overflow-y:auto;max-width:100%;min-width:0}
.dash-main .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.dash-main .header h2{font-size:1.5rem;font-weight:800}
.user-chip{display:flex;align-items:center;gap:10px;font-size:.8rem;font-weight:600;background:var(--white);padding:6px 16px;border-radius:30px;border:1px solid rgba(0,0,0,.06);cursor:default}
.user-chip i{color:var(--red)}
.user-chip.clickable{cursor:pointer}
.user-chip small{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:.6rem;letter-spacing:.6px}
.dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:26px}
.dash-stat{background:var(--white);padding:16px 18px;border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,.03);border:1px solid rgba(0,0,0,.03)}
.dash-stat .num{font-size:1.55rem;font-weight:800;color:var(--black);line-height:1.2}
.dash-stat .label{font-size:.7rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.dash-charts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:26px}
.dash-chart{background:var(--white);padding:18px;border-radius:var(--radius);border:1px solid rgba(0,0,0,.03);box-shadow:0 2px 8px rgba(0,0,0,.02)}
.dash-chart h4{font-size:.83rem;font-weight:700;margin-bottom:12px}
.dash-chart canvas{max-height:190px}
.panel{background:var(--white);border-radius:var(--radius);border:1px solid rgba(0,0,0,.03);box-shadow:0 2px 8px rgba(0,0,0,.02);padding:18px;margin-bottom:20px}
.panel h4{font-size:.9rem;font-weight:700;margin-bottom:12px}
.sec-title{font-size:.95rem;font-weight:800;margin:22px 0 10px}
.dash-table-wrap{background:var(--white);border-radius:var(--radius);border:1px solid rgba(0,0,0,.03);overflow:auto;box-shadow:0 2px 8px rgba(0,0,0,.02)}
.dash-table-wrap table{width:100%;border-collapse:collapse;font-size:.84rem;min-width:560px}
.dash-table-wrap th{text-align:left;padding:13px 15px;font-weight:700;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid rgba(0,0,0,.05);white-space:nowrap;background:#fcfcfb}
.dash-table-wrap td{padding:11px 15px;border-bottom:1px solid rgba(0,0,0,.03);vertical-align:middle}
.dash-table-wrap tr:last-child td{border-bottom:none}
.dash-table-wrap tbody tr:hover{background:#fafaf9}
.empty{text-align:center;color:var(--muted);padding:34px!important;font-size:.85rem}
.badge{padding:3px 11px;border-radius:20px;font-size:.68rem;font-weight:700;display:inline-block;white-space:nowrap;text-transform:capitalize}
.badge-new{background:#dbeafe;color:#1d4ed8}
.badge-contacted{background:#fef3c7;color:#b45309}
.badge-interested{background:#d1fae5;color:#065f46}
.badge-scheduled,.badge-site-visit-scheduled{background:#ede9fe;color:#5b21b6}
.badge-confirmed{background:#cffafe;color:#0e7490}
.badge-visited,.badge-completed,.badge-approved,.badge-verified,.badge-available,.badge-active,.badge-paid,.badge-allotted{background:#d1fae5;color:#065f46}
.badge-booked{background:#dbeafe;color:#1d4ed8}
.badge-sold{background:#e5e7eb;color:#374151}
.badge-blocked,.badge-pending,.badge-negotiation,.badge-upcoming,.badge-ongoing,.badge-rescheduled,.badge-hot{background:#fef3c7;color:#b45309}
.badge-lost,.badge-cancelled,.badge-inactive,.badge-rejected,.badge-overdue,.badge-cold{background:#fecaca;color:#991b1b}
.badge-warm{background:#ffedd5;color:#c2410c}
.badge-plot{background:#dcfce7;color:#166534}
.badge-flat{background:#e0e7ff;color:#3730a3}
.badge-shop{background:#fae8ff;color:#86198f}
.badge-office{background:#cffafe;color:#155e75}
.badge-villa,.badge-residential,.badge-commercial,.badge-farmhouse,.badge-mixed{background:#f1f5f9;color:#334155}
.badge-refund{background:#fee2e2;color:#991b1b}
.badge-token{background:#ede9fe;color:#5b21b6}
.badge-installment{background:#dbeafe;color:#1d4ed8}
.badge-final{background:#d1fae5;color:#065f46}
.dash-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.dash-actions .btn{padding:9px 18px;font-size:.76rem}
.dash-search{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}
.dash-search input,.dash-search select{padding:9px 14px;border:1px solid rgba(0,0,0,.07);border-radius:4px;font-family:var(--font);font-size:.83rem;background:var(--white);color:var(--black)}
.dash-search input{min-width:220px}
.dash-search input:focus,.dash-search select:focus{outline:none;border-color:var(--red)}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-2col .full{grid-column:1/-1}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card-form{background:var(--white);padding:24px;border-radius:var(--radius);border:1px solid rgba(0,0,0,.04);max-width:860px}
.form-actions{display:flex;gap:12px;flex-wrap:wrap;grid-column:1/-1}
.progress{height:8px;background:rgba(0,0,0,.07);border-radius:20px;overflow:hidden;margin-top:6px}
.progress span{display:block;height:100%;background:var(--red);border-radius:20px;transition:width .5s}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.mini-card{background:var(--white);border:1px solid rgba(0,0,0,.04);border-radius:var(--radius);padding:16px}
.mini-card .k{font-size:.7rem;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.4px}
.mini-card .v{font-size:1.15rem;font-weight:800;margin-top:4px}
.perm-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.04);font-size:.83rem;gap:12px}
.perm-row:last-child{border-bottom:none}
.switch{position:relative;width:42px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#d1d5db;border-radius:20px;transition:.25s;cursor:pointer}
.slider:before{content:'';position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s}
.switch input:checked + .slider{background:var(--red)}
.switch input:checked + .slider:before{transform:translateX(20px)}
.notif{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid rgba(0,0,0,.04);align-items:flex-start}
.notif:last-child{border-bottom:none}
.notif.unread{background:#fffbfb}
.notif .ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;background:var(--light);color:var(--red)}
.notif .ttl{font-weight:700;font-size:.85rem}
.notif .msg{font-size:.8rem;color:var(--muted)}
.notif .dt{font-size:.68rem;color:#aaa;margin-top:3px}
.toast-container{position:fixed;bottom:24px;right:24px;z-index:9500;display:flex;flex-direction:column;gap:12px;max-width:380px}
.toast{padding:15px 22px;border-radius:var(--radius);background:var(--black);color:var(--white);box-shadow:0 12px 40px rgba(0,0,0,.25);font-size:.87rem;font-weight:500;animation:slideIn .4s ease;display:flex;align-items:center;gap:12px;border-left:4px solid var(--red)}
.toast.success{border-left-color:#22c55e}
.toast.error{border-left-color:var(--red)}
.toast.info{border-left-color:#3b82f6}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}

/* PRINT */
.print-template{display:none}
@media print{
  body *{visibility:hidden}
  .print-template,.print-template *{visibility:visible}
  .print-template{display:block!important;position:fixed;left:0;top:0;width:100%;padding:36px 44px;background:white;color:black;font-family:var(--font);z-index:99999}
  .print-template .header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--red);padding-bottom:14px;margin-bottom:22px}
  .print-template .header h1{font-size:1.7rem;font-weight:800;color:var(--black)}
  .print-template .header h1 .red{color:var(--red)}
  .print-template .header .sub{font-size:.68rem;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase}
  .print-template .row{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;margin-bottom:10px}
  .print-template .field{padding:6px 0;border-bottom:1px solid #eee}
  .print-template .field.full{grid-column:1/-1}
  .print-template .field .label{font-size:.66rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .print-template .field .value{font-size:.94rem;font-weight:500;margin-top:2px}
  .print-template .signatures{display:grid;grid-template-columns:1fr 1fr 1fr;gap:30px;margin-top:38px;padding-top:22px;border-top:1px solid #ddd}
  .print-template .signatures .sig{text-align:center}
  .print-template .signatures .sig .line{border-bottom:1px solid var(--black);width:100%;height:38px;margin-bottom:4px}
  .print-template .signatures .sig .lbl{font-size:.68rem;color:var(--muted);font-weight:600}
  .print-template .photo{width:96px;height:96px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:2.3rem;color:#ccc;margin-bottom:8px}
  .print-template .photo-wrap{display:flex;align-items:center;gap:20px;margin-bottom:16px}
  .print-template table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:10px}
  .print-template th,.print-template td{border:1px solid #ddd;padding:7px 9px;text-align:left}
  .print-template th{background:#f5f5f5;font-size:.68rem;text-transform:uppercase;letter-spacing:.4px}
}

/* RESPONSIVE */
@media(max-width:1100px){
  .dash-sidebar{width:74px;padding:16px 0 10px}
  .dash-sidebar .brand{padding:0 10px 14px;text-align:center}
  .dash-sidebar .brand h3{font-size:.85rem}
  .dash-sidebar .brand small,.dash-sidebar .nav-item span,.dash-sidebar .nav-sec,.dash-sidebar .nav-item .pill{display:none}
  .dash-sidebar .nav-item{padding:13px 0;justify-content:center}
  .dash-sidebar .nav-item i{font-size:1.15rem;width:auto}
  .dash-sidebar .back-link,.dash-sidebar .logout-btn{margin:6px 8px;padding:9px 4px;font-size:.6rem}
  .dash-main{padding:20px}
  .dash-charts{grid-template-columns:1fr}
}
@media(max-width:600px){
  .dash-sidebar{width:58px}
  .dash-main{padding:14px}
  .dash-stats{grid-template-columns:repeat(2,1fr)}
  .form-2col,.form-row{grid-template-columns:1fr}
  .dash-main .header h2{font-size:1.15rem}
  .toast-container{left:12px;right:12px;max-width:100%}
  .dash-search input{min-width:100%}
  .login-box{padding:32px 22px}
}
</style>
</head>
<body>

<!-- ================= BOOT ================= -->
<div class="boot" id="bootScreen"><div class="spin"></div><div id="bootMsg">Loading AVYA Portal…</div></div>

<!-- ================= LOGIN ================= -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="logo">AVYA<span class="red">.</span></div>
    <h2>BUSINESS PORTAL</h2>
    <p class="sub">Sign in to manage leads, inventory, bookings and payments.</p>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@company.com" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary w-full"><i class="fas fa-sign-in-alt"></i> Login</button>
    </form>
    <div class="login-footer" style="margin-top:14px;"><span class="link-btn" onclick="forgotPassword()">Forgot password?</span></div>
    <div class="login-footer"><a href="index.html">← Back to Website</a></div>
  </div>
</div>

<!-- ================= SHELL ================= -->
<div class="dashboard-shell" id="dashboardShell">
  <aside class="dash-sidebar" id="dashSidebar">
    <div class="brand">
      <h3>AVYA<span class="red">.</span></h3>
      <small id="dashRoleLabel">COMMAND CENTER</small>
    </div>
    <div id="dashNavItems"></div>
    <div class="spacer"></div>
    <a href="index.html" class="back-link"><i class="fas fa-globe"></i> View Website</a>
    <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </aside>
  <main class="dash-main" id="dashMain">
    <div class="header">
      <h2 id="dashTitle">Dashboard</h2>
      <div class="user-chip" id="dashUser"></div>
    </div>
    <div id="dashContent"></div>
  </main>
</div>

<!-- ================= PRINT ================= -->
<div class="print-template" id="printTemplate">
  <div class="header">
    <div>
      <h1>AVYA<span class="red">.</span></h1>
      <div class="sub" id="printCompanySub">Developer &amp; Construction</div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:.8rem;font-weight:700;" id="printSubtitle">DOCUMENT</div>
      <div style="font-size:.68rem;color:var(--muted);">A4 &bull; Confidential</div>
    </div>
  </div>
  <div id="printContent"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
/* ============================================================
   1. FIREBASE CONFIG  (apna config yahan paste karo)
============================================================ */

function fmtMoney(n) { return '₹' + (Number(n) || 0).toLocaleString('en-IN'); }
function fmtShort(n) {
  n = Number(n) || 0;
  if (n >= 10000000) return '₹' + (n / 10000000).toFixed(2) + ' Cr';
  if (n >= 100000) return '₹' + (n / 100000).toFixed(2) + ' L';
  if (n >= 1000) return '₹' + (n / 1000).toFixed(1) + 'K';
  return '₹' + n;
}
function parseD(d) { return /^\d{4}-\d{2}-\d{2}$/.test(String(d)) ? new Date(d + 'T00:00:00') : new Date(d); }
function fmtDate(d) {
  if (!d) return '—';
  const dt = parseD(d);
  if (isNaN(dt)) return esc(d);
  return dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtDateTime(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt)) return esc(d);
  return dt.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function numberToWords(num) {
  num = Math.round(Number(num) || 0);
  if (num === 0) return 'Zero Rupees Only';
  const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two = n => n < 20 ? a[n] : b[Math.floor(n / 10)] + (n % 10 ? ' ' + a[n % 10] : '');
  const three = n => (n > 99 ? a[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' : '') : '') + two(n % 100);
  let out = '';
  const cr = Math.floor(num / 10000000); num %= 10000000;
  const la = Math.floor(num / 100000); num %= 100000;
  const th = Math.floor(num / 1000); num %= 1000;
  if (cr) out += three(cr) + ' Crore ';
  if (la) out += three(la) + ' Lakh ';
  if (th) out += three(th) + ' Thousand ';
  if (num) out += three(num);
  return out.trim() + ' Rupees Only';
}

const SHARED = ['managers','projects','units','leads','customers','siteVisits','followUps','bookings','payments','receipts','documents','enquiries','notifications'];
const CONFIGS = ['cms','settings','permissions'];
const DESC_SORT = { notifications: 'date', audit: 'date', payments: 'date', receipts: 'date', documents: 'date', enquiries: 'date', bookings: 'createdAt' };
const DEFAULTS = {
  cms: { heroTitle: '', heroSubtitle: '', about: '', phone: '', email: '', address: '', seoTitle: '', seoDescription: '', testimonials: [], faqs: [] },
  settings: { companyName: 'AVYA Developer & Construction', gst: '', address: '', phone: '', email: '', receiptPrefix: 'AVYA', receiptNext: 1001, currency: 'INR' },
  permissions: DEFAULT_PERMS
};
const cache = {};
const shadow = {};   // last persisted JSON per doc (so in-place edits are detected)
let unsubs = [];

function getData(key, fallback) { return cache[key] !== undefined ? cache[key] : fallback; }

async function commitOps(key, ops) {
  for (let i = 0; i < ops.length; i += 400) {
    const b = db.batch();
    ops.slice(i, i + 400).forEach(o => {
      const r = db.collection(key).doc(o.id);
      if (o.t === 'set') b.set(r, o.data); else b.delete(r);
    });
    try { await b.commit(); } catch (e) { fail(e); }
  }
}
function setData(key, value) {
  cache[key] = value;
  if (CONFIGS.includes(key)) {
    const s = JSON.stringify(value);
    shadow[key] = s;
    return db.collection('config').doc(key).set({ value: JSON.parse(s) }).catch(fail);
  }
  if (!SHARED.includes(key)) return Promise.resolve();
  const sh = shadow[key] || (shadow[key] = new Map());
  const ops = [], seen = new Set();
  (value || []).forEach(x => {
    if (!x || !x.id) return;
    seen.add(x.id);
    const s = JSON.stringify(x);
    if (sh.get(x.id) !== s) { ops.push({ t: 'set', id: x.id, data: JSON.parse(s) }); sh.set(x.id, s); }
  });
  Array.from(sh.keys()).forEach(id => { if (!seen.has(id)) { ops.push({ t: 'del', id }); sh.delete(id); } });
  return ops.length ? commitOps(key, ops) : Promise.resolve();
}
function writeDoc(col, obj) {
  return db.collection(col).doc(obj.id).set(JSON.parse(JSON.stringify(obj))).catch(fail);
}
function sortList(k, arr) {
  const f = DESC_SORT[k];
  if (f) arr.sort((a, b) => String(b[f] || '').localeCompare(String(a[f] || '')));
  else arr.sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
  return arr;
}

let refreshT = null;
const FORM_VIEWS = ['cms', 'settings', 'profile'];
function scheduleRefresh() {
  if (!currentUser || !appReady) return;
  clearTimeout(refreshT);
  refreshT = setTimeout(() => {
    renderNav();
    if (inForm || FORM_VIEWS.includes(currentView)) return;
    const df = Q('docFile');
    if (currentView === 'documents' && df && df.files && df.files.length) return;
    const a = document.activeElement;
    const id = a && a.id, pos = a && a.selectionStart;
    renderView(currentView);
    if (id) { const el = Q(id); if (el && el.focus) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
  }, 250);
}

function startListeners() {
  return new Promise((resolve) => {
    const cols = SHARED.concat(currentUser === 'admin' ? ['audit'] : []);
    let pending = cols.length + 1;
    const first = {};
    const done = (k) => { if (first[k]) return; first[k] = true; if (--pending === 0) resolve(); };
    cols.forEach(k => {
      cache[k] = []; shadow[k] = new Map();
      unsubs.push(db.collection(k).onSnapshot(snap => {
        const arr = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
        sortList(k, arr);
        cache[k] = arr;
        const m = new Map(); arr.forEach(x => m.set(x.id, JSON.stringify(x)));
        shadow[k] = m;
        done(k); scheduleRefresh();
      }, err => { console.error(k, err); showToast('Cannot read "' + k + '": ' + err.message, 'error', 7000); done(k); }));
    });
    unsubs.push(db.collection('config').onSnapshot(snap => {
      snap.docs.forEach(d => { cache[d.id] = d.data().value; shadow[d.id] = JSON.stringify(d.data().value); });
      CONFIGS.forEach(k => { if (cache[k] === undefined || cache[k] === null) cache[k] = JSON.parse(JSON.stringify(DEFAULTS[k])); });
      done('config'); scheduleRefresh();
    }, err => { console.error(err); showToast('Cannot read config: ' + err.message, 'error', 7000); CONFIGS.forEach(k => { if (cache[k] === undefined) cache[k] = JSON.parse(JSON.stringify(DEFAULTS[k])); }); done('config'); }));
  });
}

async function nextReceiptNo() {
  const ref = db.collection('config').doc('settings');
  const r = await db.runTransaction(async t => {
    const d = await t.get(ref);
    const v = d.exists ? d.data().value : JSON.parse(JSON.stringify(DEFAULTS.settings));
    const num = Number(v.receiptNext) || 1001;
    v.receiptNext = num + 1;
    t.set(ref, { value: v });
    return { num, prefix: v.receiptPrefix || 'AVYA', v };
  });
  cache.settings = r.v;
  return `${r.prefix}/${new Date().getFullYear()}/${String(r.num).padStart(4, '0')}`;
}

function downloadCSV(filename, headers, rows) {
  const safe = (v) => { let s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const csv = [headers.map(safe).join(','), ...rows.map(r => r.map(safe).join(','))].join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  showToast('CSV exported!', 'success');
}

function authMsg(err) {
  const c = err && err.code || '';
  if (['auth/invalid-credential', 'auth/user-not-found', 'auth/wrong-password', 'auth/invalid-email'].includes(c)) return 'Invalid email or password.';
  if (c === 'auth/too-many-requests') return 'Too many attempts. Please try again later.';
  if (c === 'auth/network-request-failed') return 'Network error. Check your internet.';
  if (c === 'auth/user-disabled') return 'This account is disabled.';
  return (err && err.message) || 'Login failed.';
}

Q('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  if (CONFIG_MISSING) return showToast('Firebase config missing in admin.html', 'error');
  const email = Q('loginEmail').value.trim(), pass = Q('loginPassword').value;
  if (!email || !pass) return showToast('Enter email and password.', 'error');
  const btn = Q('loginBtn'); btn.disabled = true;
  try { await auth.signInWithEmailAndPassword(email, pass); }
  catch (err) { showToast(authMsg(err), 'error'); }
  btn.disabled = false;
});

async function forgotPassword() {
  const email = Q('loginEmail').value.trim();
  if (!email) return showToast('Pehle email field mein apna email daalo.', 'error');
  try { await auth.sendPasswordResetEmail(email); showToast('Password reset link email par bhej diya.', 'success'); }
  catch (err) { showToast(authMsg(err), 'error'); }
}

function hideBoot() { Q('bootScreen').classList.add('hide'); }
function showLogin() {
  Q('dashboardShell').classList.remove('active');
  Q('loginScreen').classList.add('active');
  hideBoot();
}
function teardown() {
  unsubs.forEach(u => { try { u(); } catch (e) {} });
  unsubs = [];
  Object.keys(cache).forEach(k => delete cache[k]);
  Object.keys(shadow).forEach(k => delete shadow[k]);
  Object.keys(viewState).forEach(k => delete viewState[k]);
  Object.values(charts).forEach(c => c && c.destroy && c.destroy());
  charts = {}; appReady = false; inForm = false;
  currentUser = null; currentManagerId = null; currentUid = null; currentName = ''; currentEmail = '';
  currentView = 'dashboard';
}

if (CONFIG_MISSING) {
  Q('bootMsg').innerHTML = '⚠️ Firebase config missing.<br><small style="font-weight:500;opacity:.7">admin.html mein <code>firebaseConfig</code> replace karo.</small>';
  document.querySelector('#bootScreen .spin').style.display = 'none';
} else {
  auth.onAuthStateChanged(async user => {
    if (!user) { teardown(); showLogin(); return; }
    try {
      const snap = await db.collection('users').doc(user.uid).get();
      const u = snap.exists ? snap.data() : null;
      if (!u || u.status !== 'active' || !['admin', 'manager'].includes(u.role) || (u.role === 'manager' && !u.managerId)) {
        showToast('Aapke paas is portal ka access nahi hai.', 'error', 6000);
        await auth.signOut(); return;
      }
      currentUser = u.role; currentManagerId = u.managerId || null; currentUid = user.uid; currentEmail = user.email || '';
      await startListeners();
      if (currentUser === 'manager') {
        const me = getData('managers', []).find(m => m.id === currentManagerId);
        if (!me || me.status !== 'active') { showToast('Manager profile inactive ya missing hai.', 'error', 6000); await auth.signOut(); return; }
        currentName = me.fullName;
      } else currentName = 'Admin';
      unsubs.push(db.collection('users').doc(user.uid).onSnapshot(s => {
        if (s.exists && s.data().status !== 'active') { showToast('Aapka account deactivate kar diya gaya hai.', 'error', 6000); auth.signOut(); }
      }));
      showDashboard();
    } catch (err) {
      console.error(err);
      showToast('Login error: ' + err.message, 'error', 7000);
      try { await auth.signOut(); } catch (e) {}
    }
  });
}

function renderNav() {
  const container = Q('dashNavItems');
  const items = (NAV[currentUser] || []).filter(i => can(i.perm));
  const unread = unreadCount();
  container.innerHTML = `<div class="nav-sec">Modules</div>` + items.map(item =>
    `<div class="nav-item ${currentView === item.id ? 'active' : ''}" data-view="${item.id}">
      <i class="fas ${item.icon}"></i><span>${item.label}</span>
      ${item.id === 'notifications' && unread ? `<span class="pill">${unread}</span>` : ''}
    </div>`
  ).join('');
  container.querySelectorAll('.nav-item').forEach(el =>
    el.addEventListener('click', function () { navigateTo(this.dataset.view); })
  );
}
function navigateTo(view) {
  currentView = view;
  document.querySelectorAll('#dashNavItems .nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
  const meta = (NAV[currentUser] || []).find(i => i.id === view);
  Q('dashTitle').textContent = meta ? meta.label : (view.charAt(0).toUpperCase() + view.slice(1));
  renderView(view);
  Q('dashMain').scrollTop = 0;
}

  dashboard: renderDashboard, projects: renderProjectsView, inventory: renderInventoryView,

  reports: renderReportsView, notifications: renderNotificationsView, cms: renderCmsView,
  settings: renderSettingsView, targets: renderTargetsView, profile: renderProfileView
};
function renderView(view) {
  inForm = false;
  const el = Q('dashContent');
  const fn = VIEWS[view];
  if (!fn) { el.innerHTML = '<p>View not found.</p>'; return; }
  Object.values(charts).forEach(c => c && c.destroy && c.destroy());
  charts = {};
  try { fn(el); } catch (err) { console.error(err); el.innerHTML = `<div class="panel">Error: ${esc(err.message)}</div>`; }
}

function renderDashboard(c) {
  const isAdmin = currentUser === 'admin';
  const leads = getData('leads', []), visits = getData('siteVisits', []), followups = getData('followUps', []);
  const bookings = getData('bookings', []), payments = getData('payments', []), units = getData('units', []);
  const enquiries = getData('enquiries', []), managers = getData('managers', []);

  const myLeads = isAdmin ? leads : leads.filter(l => l.managerId === currentManagerId);
  const myVisits = isAdmin ? visits : visits.filter(v => v.managerId === currentManagerId);
  const myFollowups = isAdmin ? followups : followups.filter(f => f.managerId === currentManagerId);
  const myBookings = isAdmin ? bookings : bookings.filter(b => b.managerId === currentManagerId);
  const myPayments = isAdmin ? payments : payments.filter(p => { const b = bookings.find(x => x.id === p.bookingId); return b && b.managerId === currentManagerId; });

  const today = todayISO();
  const collected = myPayments.filter(p => p.status === 'verified' && p.type !== 'refund').reduce((s, p) => s + Number(p.amount || 0), 0);
  const pendingDues = myBookings.filter(b => b.status === 'approved' || b.status === 'allotted')
    .reduce((s, b) => s + Math.max(0, Number(b.totalPrice || 0) - bookingPaid(b.id)), 0);
  const todayEnq = enquiries.filter(e => String(e.date).slice(0, 10) === today).length;
  const upcomingVisits = myVisits.filter(v => v.status === 'scheduled' || v.status === 'confirmed');
  const pendingFollowups = myFollowups.filter(f => f.status === 'pending');

  const me = !isAdmin ? managers.find(m => m.id === currentManagerId) : null;
  const monthAch = me ? collectedBy(me.id, true) : 0;
  const target = me ? Number(me.targetAmount || 0) : 0;
  const targetPct = target > 0 ? Math.max(0, Math.min(100, Math.round((monthAch / target) * 100))) : 0;

  const stats = isAdmin ? `
    <div class="dash-stat"><div class="num">${leads.length}</div><div class="label">Total Leads</div></div>
    <div class="dash-stat"><div class="num">${leads.filter(l => l.status === 'new').length}</div><div class="label">New Leads</div></div>
    <div class="dash-stat"><div class="num">${bookings.filter(b => b.status === 'pending').length}</div><div class="label">Pending Bookings</div></div>
    <div class="dash-stat"><div class="num">${units.filter(u => u.status === 'available').length}</div><div class="label">Available Units</div></div>
    <div class="dash-stat"><div class="num">${fmtShort(collected)}</div><div class="label">Collected</div></div>
    <div class="dash-stat"><div class="num">${fmtShort(pendingDues)}</div><div class="label">Pending Dues</div></div>
    <div class="dash-stat"><div class="num">${todayEnq}</div><div class="label">Today's Enquiries</div></div>
    <div class="dash-stat"><div class="num">${upcomingVisits.length}</div><div class="label">Upcoming Visits</div></div>
  ` : `
    <div class="dash-stat"><div class="num">${myLeads.length}</div><div class="label">My Leads</div></div>
    <div class="dash-stat"><div class="num">${myLeads.filter(l => l.status === 'new').length}</div><div class="label">New</div></div>
    <div class="dash-stat"><div class="num">${pendingFollowups.length}</div><div class="label">Pending Follow-ups</div></div>
    <div class="dash-stat"><div class="num">${upcomingVisits.length}</div><div class="label">Upcoming Visits</div></div>
    <div class="dash-stat"><div class="num">${myBookings.length}</div><div class="label">My Bookings</div></div>
    <div class="dash-stat"><div class="num">${fmtShort(monthAch)}</div><div class="label">This Month</div></div>
    <div class="dash-stat"><div class="num">${targetPct}%</div><div class="label">Monthly Target</div>
      <div class="progress"><span style="width:${targetPct}%"></span></div></div>
  `;
  const recentBookings = myBookings.slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')).slice(0, 5);

  c.innerHTML = `
    <div class="dash-stats">${stats}</div>
    <div class="dash-charts">
      <div class="dash-chart"><h4>${isAdmin ? 'Collection Trend (last 6 entries)' : 'My Collection Trend'}</h4><canvas id="chartCollection"></canvas></div>
      <div class="dash-chart"><h4>Leads by Status</h4><canvas id="chartStatus"></canvas></div>
      <div class="dash-chart"><h4>${isAdmin ? 'Project-wise Sales' : 'My Leads by Source'}</h4><canvas id="chartProject"></canvas></div>
      <div class="dash-chart"><h4>${isAdmin ? 'Manager Performance' : 'My Follow-up Status'}</h4><canvas id="chartPerf"></canvas></div>
    </div>
    ${isAdmin ? `
      <div class="sec-title">Today's Website Enquiries</div>
      ${table(['Name','Phone','Project','Message','Date'],
        enquiries.filter(e => String(e.date).slice(0, 10) === today).slice(0, 5).map(e => [
          `<strong>${esc(e.name)}</strong>`, esc(e.phone), esc(e.project || '—'), esc(String(e.message || '—').slice(0, 50)), fmtDate(e.date)
        ]), 'No enquiries today.')}` : ''}
    <div class="sec-title">Upcoming Site Visits</div>
    ${table(['Customer','Project','Date','Time','Status'],
      upcomingVisits.slice(0, 5).map(v => [

      ]), 'No upcoming visits.')}

    ${table(['Customer','Project','Unit','Token','Total','Status'],
      recentBookings.map(b => [
        `<strong>${esc(b.customerName)}</strong>`, esc(projectName(b.projectId)), esc(unitLabel(b.unitId)),

  setTimeout(() => initDashboardCharts(isAdmin, myLeads, myFollowups, myPayments), 80);

function initDashboardCharts(isAdmin, myLeads, myFollowups, myPayments) {
  if (typeof Chart === 'undefined' || currentView !== 'dashboard') return;
  const verified = myPayments.filter(p => p.status === 'verified').slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).slice(-6);
  const collLabels = verified.map(p => fmtDate(p.date));
  const collData = verified.map(p => Number(p.amount || 0));
  const counts = STATUSES.map(s => myLeads.filter(l => l.status === s).length);
  const opt = (extra) => Object.assign({ responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } } }, extra || {});

  const ctx1 = Q('chartCollection'), ctx2 = Q('chartStatus'), ctx3 = Q('chartProject'), ctx4 = Q('chartPerf');
  if (ctx1) charts.collection = new Chart(ctx1, {
    type: 'line',
    data: { labels: collLabels.length ? collLabels : ['No data'], datasets: [{ label: 'Collection', data: collData.length ? collData : [0], borderColor: '#B5121B', backgroundColor: 'rgba(181,18,27,.1)', tension: .35, fill: true, pointRadius: 4 }] },
    options: opt({ scales: { y: { ticks: { callback: v => fmtShort(v), font: { size: 9 } } }, x: { ticks: { font: { size: 9 } } } } })
  });
  if (ctx2) charts.status = new Chart(ctx2, {
    type: 'doughnut',
    data: { labels: ['New','Contacted','Interested','Scheduled','Visited','Negotiation','Booked','Lost'], datasets: [{ data: counts, backgroundColor: ['#3b82f6','#f59e0b','#10b981','#8b5cf6','#06b6d4','#f97316','#22c55e','#ef4444'] }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 9 } } } } }
  });
  if (ctx3) {
    if (isAdmin) {
      const projects = getData('projects', []), units = getData('units', []);
      charts.project = new Chart(ctx3, {
        type: 'bar',
        data: { labels: projects.map(p => p.name), datasets: [{ label: 'Units Sold', data: projects.map(p => units.filter(u => u.projectId === p.id && (u.status === 'booked' || u.status === 'sold')).length), backgroundColor: '#B5121B', borderRadius: 4 }] },
        options: opt({ scales: { y: { beginAtZero: true, ticks: { precision: 0, font: { size: 9 } } }, x: { ticks: { font: { size: 9 } } } } })
      });
    } else {
      charts.project = new Chart(ctx3, {
        type: 'bar',
        data: { labels: LEAD_SOURCES, datasets: [{ label: 'Leads', data: LEAD_SOURCES.map(s => myLeads.filter(l => l.source === s).length), backgroundColor: '#B5121B', borderRadius: 4 }] },
        options: opt({ scales: { y: { beginAtZero: true, ticks: { precision: 0, font: { size: 9 } } }, x: { ticks: { font: { size: 8 } } } } })
      });
    }
  }
  if (ctx4) {
    if (isAdmin) {
      const managers = getData('managers', []), leads = getData('leads', []);
      charts.perf = new Chart(ctx4, {
        type: 'bar',
        data: { labels: managers.map(m => m.fullName), datasets: [{ label: 'Leads', data: managers.map(m => leads.filter(l => l.managerId === m.id).length), backgroundColor: '#151515', borderRadius: 4 }] },
        options: opt({ scales: { y: { beginAtZero: true, ticks: { precision: 0, font: { size: 9 } } }, x: { ticks: { font: { size: 9 } } } } })
      });
    } else {
      charts.perf = new Chart(ctx4, {
        type: 'doughnut',
        data: { labels: ['Pending', 'Completed'], datasets: [{ data: [myFollowups.filter(f => f.status === 'pending').length, myFollowups.filter(f => f.status === 'completed').length], backgroundColor: ['#f59e0b', '#22c55e'] }] },
        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } } }
      });
    }
  }
}

  const managers = getData('managers', []);

      <div class="form-group"><label>RERA No.</label><input type="text" id="pRera" value="${esc(p ? p.rera : '')}" /></div>
      <div class="form-group"><label>Price Min (₹)</label><input type="number" id="pMin" value="${p ? (p.priceMin || '') : ''}" min="0" /></div>
      <div class="form-group"><label>Price Max (₹)</label><input type="number" id="pMax" value="${p ? (p.priceMax || '') : ''}" min="0" /></div>
      <div class="form-group"><label>Launch Date</label><input type="date" id="pLaunch" value="${esc(p ? p.launchDate : '')}" /></div>
      <div class="form-group full"><label>Amenities (comma separated)</label><input type="text" id="pAmen" value="${esc(p ? (p.amenities || []).join(', ') : '')}" /></div>
      <div class="form-group full"><label>Description</label><textarea id="pDesc" rows="3">${esc(p ? p.description : '')}</textarea></div>
      <div class="form-group full"><label>Assign Managers</label>
        <div style="display:flex;flex-wrap:wrap;gap:14px;padding:10px 0;">
          ${managers.length ? managers.map(m => `<label style="display:flex;align-items:center;gap:7px;font-size:.84rem;font-weight:500;">
            <input type="checkbox" class="pMgr" value="${esc(m.id)}" style="width:auto;" ${p && (m.projects || []).includes(p.name) ? 'checked' : ''} /> ${esc(m.fullName)}</label>`).join('') : '<span style="color:var(--muted);font-size:.82rem;">No employees yet.</span>'}
        </div></div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> ${p ? 'Update' : 'Save'} Project</button>
        <button type="button" class="btn btn-outline-dark" onclick="navigateTo('projects')">Cancel</button>
      </div>
    </form>`);

  Q('projectForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const projects = getData('projects', []);
    const name = Q('pName').value.trim();
    if (!name) return showToast('Project name is required.', 'error');
    if (projects.some(x => x.name.toLowerCase() === name.toLowerCase() && (!p || x.id !== p.id))) return showToast('Same name ka project already exists.', 'error');
    const mgrIds = Array.from(document.querySelectorAll('.pMgr:checked')).map(x => x.value);
    const payload = {
      name, code: Q('pCode').value.trim(), location: Q('pLocation').value.trim(),
      category: Q('pCategory').value, status: Q('pStatus').value,
      totalUnits: Number(Q('pTotal').value) || 0, priceMin: Number(Q('pMin').value) || 0, priceMax: Number(Q('pMax').value) || 0,
      rera: Q('pRera').value.trim(), launchDate: Q('pLaunch').value,
      amenities: Q('pAmen').value.split(',').map(s => s.trim()).filter(Boolean),
      description: Q('pDesc').value.trim()
    };
    if (p) {
      const idx = projects.findIndex(x => x.id === p.id);
      projects[idx] = Object.assign({}, projects[idx], payload);
      audit('Project updated', 'Projects', name);
    } else {
      projects.push(Object.assign({ id: uid('pr'), createdAt: todayISO() }, payload));
      audit('Project created', 'Projects', name);
    }
    setData('projects', projects);
    syncManagerProjects(mgrIds, name, p ? p.name : null);
    showToast('Project saved successfully!', 'success');
    navigateTo('projects');
  });
}
function syncManagerProjects(managerIds, projectName, oldName) {
  const managers = getData('managers', []);
  managers.forEach(m => {
    m.projects = (m.projects || []).filter(x => x !== oldName && x !== projectName);
    if (managerIds.includes(m.id)) m.projects.push(projectName);
  });

  const projects = getData('projects', []);
  setForm(`
    <h3 class="mb-16">Bulk Add Units</h3>

      <div class="form-group"><label>Area Unit</label>
        <select id="bAreaUnit">${['sq.ft','sq.yd','sq.m','acre'].map(a => `<option value="${a}">${a}</option>`).join('')}</select></div>
      <div class="form-group"><label>Price (₹)</label><input type="number" id="bPrice" value="1500000" /></div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Generate Units</button>
        <button type="button" class="btn btn-outline-dark" onclick="navigateTo('inventory')">Cancel</button>
      </div>
    </form>`);
  Q('bulkForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const pid = Q('bProject').value;
    if (!pid) return showToast('Select a project.', 'error');
    const prefix = Q('bPrefix').value, start = Number(Q('bStart').value) || 101;
    const count = Math.min(100, Number(Q('bCount').value) || 1);
    const type = Q('bType').value, area = Number(Q('bArea').value) || 0, areaUnit = Q('bAreaUnit').value, price = Number(Q('bPrice').value) || 0;
    const units = getData('units', []);
    const exist = new Set(units.filter(u => u.projectId === pid).map(u => u.unitNo.toLowerCase()));
    let added = 0, skipped = 0;
    for (let i = 0; i < count; i++) {
      const no = prefix + (start + i);
      if (exist.has(no.toLowerCase())) { skipped++; continue; }
      units.push({ id: uid('u'), projectId: pid, unitNo: no, type, area, areaUnit, floor: '—', facing: '', block: '', price, status: 'available', notes: '', createdAt: todayISO() });
      added++;
    }
    setData('units', units);
    audit('Bulk units created', 'Inventory', `${added} units in ${projectName(pid)}`);
    showToast(`${added} units added${skipped ? `, ${skipped} duplicate skipped` : ''}.`, 'success');
    navigateTo('inventory');
  });
}

    const managers = getData('managers', []);
    const empId = Q('mEmpId').value.trim();
    if (managers.some(x => x.empId.toLowerCase() === empId.toLowerCase() && (!m || x.id !== m.id))) return showToast('Employee ID already used.', 'error');
    const payload = {
      fullName: Q('mFullName').value.trim(), empId, mobile, email: Q('mEmail').value.trim(),
      designation: Q('mDesignation').value.trim(), department: Q('mDepartment').value.trim(),
      joiningDate: Q('mJoining').value, area: Q('mArea').value.trim(),
      targetAmount: Number(Q('mTarget').value) || 0, commissionPct: Number(Q('mComm').value) || 0,
      username: Q('mUsername').value.trim(), status: Q('mStatus').value,
      address: Q('mAddress').value.trim(), emergency: Q('mEmergency').value.trim(),
      projects: Array.from(document.querySelectorAll('.mProj:checked')).map(x => x.value)
    };
    if (!payload.fullName) return showToast('Name is required.', 'error');
    const btn = Q('mSaveBtn'); btn.disabled = true;
    try {
      if (m) {
        const idx = managers.findIndex(x => x.id === m.id);
        managers[idx] = Object.assign({}, managers[idx], payload);
        if (m.authUid && payload.status !== m.status) await db.collection('users').doc(m.authUid).update({ status: payload.status });
        await setData('managers', managers);
        audit('Employee updated', 'Employees', payload.fullName);
      } else {
        if (!payload.email) throw new Error('Email required for login.');
        const pass = Q('mPass').value;
        if (pass.length < 6) throw new Error('Password kam se kam 6 characters ka rakho.');
        // Secondary app: admin logged-in rehta hai
        let sec = firebase.apps.find(a => a.name === 'secondary');
        if (!sec) sec = firebase.initializeApp(firebaseConfig, 'secondary');
        const cred = await sec.auth().createUserWithEmailAndPassword(payload.email, pass);
        const newId = uid('m');
        try {
          await db.collection('users').doc(cred.user.uid).set({ role: 'manager', managerId: newId, status: payload.status, email: payload.email });
        } catch (er) { await cred.user.delete().catch(() => {}); throw er; }
        await sec.auth().signOut();
        managers.push(Object.assign({ id: newId, authUid: cred.user.uid, photo: '', payouts: [], createdAt: todayISO() }, payload));
        await setData('managers', managers);
        audit('Employee created', 'Employees', payload.fullName);
      }
      showToast('Employee saved!', 'success');
      navigateTo('managers');
    } catch (err) {
      const msg = err.code === 'auth/email-already-in-use' ? 'Is email ka login pehle se bana hua hai.' : (err.message || 'Error');
      showToast(msg, 'error', 6000);
      btn.disabled = false;
    }
  });
}
async function toggleManagerStatus(id) {
  const m = getData('managers', []).find(x => x.id === id);
  if (!m) return;
  const ns = m.status === 'active' ? 'inactive' : 'active';
  try { if (m.authUid) await db.collection('users').doc(m.authUid).update({ status: ns }); }
  catch (e) { return fail(e); }
  const managers = getData('managers', []);
  managers.find(x => x.id === id).status = ns;
  setData('managers', managers);
  audit('Employee status changed', 'Employees', `${m.fullName} → ${ns}`);
  showToast(`Employee ${ns}.`, 'success');
  renderView('managers');
}
async function resetManagerPassword(id) {
  const m = getData('managers', []).find(x => x.id === id);
  if (!m || !m.email) return showToast('Email not found.', 'error');
  if (!confirm(`${m.email} par password reset link bhejna hai?`)) return;
  try { await auth.sendPasswordResetEmail(m.email); showToast('Reset link bhej diya.', 'success'); audit('Password reset sent', 'Employees', m.fullName); }
  catch (e) { showToast(authMsg(e), 'error'); }
}
function addPayout(id) {
  const managers = getData('managers', []);
  const m = managers.find(x => x.id === id);
  if (!m) return;
  const amt = prompt(`Record payout for ${m.fullName} (₹):`);
  if (amt === null) return;
  const n = Number(amt);
  if (!n || n <= 0) return showToast('Enter a valid amount.', 'error');
  m.payouts = m.payouts || [];
  m.payouts.push({ id: uid('po'), amount: n, date: todayISO(), status: 'paid', note: 'Payout by admin' });
  setData('managers', managers);
  notify('Commission Paid', `₹${n.toLocaleString('en-IN')} commission credited.`, { role: 'manager', managerId: id, type: 'success' });
  audit('Payout recorded', 'Employees', `${m.fullName} • ${fmtMoney(n)}`);
  showToast('Payout recorded.', 'success');
  renderView('managers');
}

      </div>

      id: uid('b'), customerName: Q('bCustomer').value.trim(), phone,
      projectId: Q('bProject').value, unitId: uId,
      managerId: currentUser === 'manager' ? currentManagerId : '',
      bookingDate: Q('bDate').value || todayISO(), tokenAmount: token, totalPrice: total,
      plan: Q('bPlan').value, status: 'pending', remarks: Q('bRemarks').value.trim(),
      approvedBy: '', approvedAt: '', createdAt: new Date().toISOString()
    };

      await db.runTransaction(async t => {
        const ur = db.collection('units').doc(uId);
        const us = await t.get(ur);
        if (!us.exists || us.data().status !== 'available') throw new Error('Yeh unit ab available nahi hai (kisi aur ne book/block kar diya).');
        t.update(ur, { status: 'blocked' });
        t.set(db.collection('bookings').doc(booking.id), booking);
      });
      const u = getData('units', []).find(x => x.id === uId);
      notify('Booking Request Pending', `${booking.customerName} requested ${u ? u.unitNo : ''} in ${projectName(booking.projectId)}.`, { role: 'admin', type: 'warning' });
      audit('Booking request submitted', 'Bookings', `${booking.customerName} • ${u ? u.unitNo : ''}`);
      showToast('Booking request submitted for approval!', 'success');
      navigateTo('bookings');
    } catch (err) { showToast(err.message, 'error', 6000); btn.disabled = false; }
  });

function approveBooking(id) {
  if (!can('bookings.approve')) return showToast('You do not have permission.', 'error');
  const bookings = getData('bookings', []);
  const b = bookings.find(x => x.id === id);
  if (!b || b.status !== 'pending') return;
  const units = getData('units', []);
  const u = units.find(x => x.id === b.unitId);
  if (u && (u.status === 'booked' || u.status === 'sold')) return showToast('Unit is already booked/sold.', 'error');
  b.status = 'approved'; b.approvedBy = currentName; b.approvedAt = new Date().toISOString();
  if (u) { u.status = 'booked'; u.bookedBy = b.customerName; }
  setData('units', units);
  setData('bookings', bookings);
  const payments = getData('payments', []);
  if (Number(b.tokenAmount) > 0 && !payments.some(p => p.bookingId === b.id && p.type === 'token' && p.status !== 'rejected')) {
    payments.unshift({ id: uid('p'), bookingId: b.id, customer: b.customerName, projectId: b.projectId, amount: Number(b.tokenAmount), mode: 'UPI', date: todayISO(), type: 'token', status: 'pending', reference: '', receiptNo: '', verifiedBy: '', createdAt: new Date().toISOString() });
    setData('payments', payments);
  }
  notify('Booking Approved', `Booking for ${b.customerName} (${u ? u.unitNo : ''}) has been approved.`, { role: 'manager', managerId: b.managerId, type: 'success' });
  audit('Booking approved', 'Bookings', `${b.customerName} • ${u ? u.unitNo : ''}`);
  showToast('Booking approved & unit booked.', 'success');
  renderView('bookings');
}
function rejectBooking(id) {

  const bookings = getData('bookings', []);
  const b = bookings.find(x => x.id === id);

  b.status = 'rejected'; b.remarks = reason || 'Rejected';
  setData('bookings', bookings);

}

async function verifyPayment(id) {
  if (!can('payments.verify')) return showToast('You do not have permission.', 'error');
  const p0 = getData('payments', []).find(x => x.id === id);
  if (!p0 || p0.status !== 'pending') return;
  let receiptNo;
  try { receiptNo = await nextReceiptNo(); } catch (e) { return fail(e); }
  const payments = getData('payments', []);
  const p = payments.find(x => x.id === id);
  if (!p || p.status !== 'pending') return;
  p.status = 'verified'; p.receiptNo = receiptNo; p.verifiedBy = currentName;
  setData('payments', payments);
  const b = getData('bookings', []).find(x => x.id === p.bookingId);
  const receipts = getData('receipts', []);
  receipts.unshift({
    id: uid('r'), no: receiptNo, date: p.date, customer: p.customer, phone: b ? b.phone : '',
    project: projectName(p.projectId), unit: b ? unitLabel(b.unitId) : '', amount: p.amount, mode: p.mode,
    type: p.type, bookingId: p.bookingId, issuedBy: currentName
  });
  setData('receipts', receipts);
  if (b && b.managerId) notify('Payment Verified', `${fmtMoney(p.amount)} from ${p.customer} verified. Receipt ${receiptNo}.`, { role: 'manager', managerId: b.managerId, type: 'success' });
  audit('Payment verified', 'Payments', `${p.customer} • ${fmtMoney(p.amount)} • ${receiptNo}`);
  showToast('Payment verified & receipt generated!', 'success');
  renderView('payments');
}
function rejectPayment(id) {

async function uploadDocument() {
  if (!can('documents.upload')) return showToast('You do not have permission.', 'error');
  const file = Q('docFile').files[0];
  const ownerId = Q('docOwner').value;
  if (!ownerId) return showToast('Select a customer.', 'error');
  if (!file) return showToast('Choose a file to upload.', 'error');
  if (file.size > 10 * 1024 * 1024) return showToast('File 10 MB se badi hai.', 'error');
  const owner = getData('customers', []).find(x => x.id === ownerId);
  const id = uid('d');
  const btn = Q('docUpBtn'); btn.disabled = true; btn.textContent = 'Uploading…';
  let url = '', path = '';
  if (storage) {
    try {
      path = `documents/${id}/${file.name.replace(/[^\w.\-]/g, '_')}`;
      const ref = storage.ref(path);
      await ref.put(file);
      url = await ref.getDownloadURL();
    } catch (err) {
      console.error(err); path = ''; url = '';
      showToast('File upload nahi hui (' + (err.code || err.message) + '). Sirf record save ho raha hai — Firebase Storage enable karo.', 'error', 8000);
    }
  }
  const docs = getData('documents', []);
  docs.unshift({
    id, name: file.name, owner: owner ? owner.name : '', ownerType: 'customer', ownerId,
    docType: Q('docTypeSel').value, status: 'pending', uploadedBy: currentUser === 'admin' ? 'admin' : currentManagerId,
    date: todayISO(), size: (file.size / 1024).toFixed(1) + ' KB', notes: '', url, path
  });
  setData('documents', docs);
  notify('Document Uploaded', `${file.name} uploaded for ${owner ? owner.name : ''}.`, { role: 'admin', type: 'info' });
  audit('Document uploaded', 'Documents', `${file.name} • ${owner ? owner.name : ''}`);
  showToast('Document uploaded & pending verification.', 'success');
  renderView('documents');
}
function setDocStatus(id, status) {
  if (!can('documents.verify')) return showToast('You do not have permission.', 'error');
  const docs = getData('documents', []);
  const d = docs.find(x => x.id === id);
  if (!d) return;
  d.status = status;
  setData('documents', docs);
  audit('Document ' + status, 'Documents', d.name);
  showToast(`Document ${status}.`, 'success');
  renderView('documents');
}
async function deleteDocument(id) {
  const d = getData('documents', []).find(x => x.id === id);
  if (!d) return;
  if (!confirm('Delete this document?')) return;
  if (d.path && storage) { try { await storage.ref(d.path).delete(); } catch (e) { console.warn(e); } }
  setData('documents', getData('documents', []).filter(x => x.id !== id));
  audit('Document deleted', 'Documents', d.name);
  showToast('Document removed.', 'info');
  renderView('documents');
}

      <h4><i class="fas fa-building"></i> Company Profile</h4>
      <form id="settingsForm" class="form-2col">
        <div class="form-group"><label>Company Name</label><input type="text" id="sName" value="${esc(s.companyName)}" /></div>
        <div class="form-group"><label>GSTIN</label><input type="text" id="sGst" value="${esc(s.gst)}" /></div>
        <div class="form-group"><label>Phone</label><input type="text" id="sPhone" value="${esc(s.phone)}" /></div>
        <div class="form-group"><label>Email</label><input type="email" id="sEmail" value="${esc(s.email)}" /></div>
        <div class="form-group full"><label>Address</label><input type="text" id="sAddress" value="${esc(s.address)}" /></div>
        <div class="form-group"><label>Receipt Prefix</label><input type="text" id="sPrefix" value="${esc(s.receiptPrefix || 'AVYA')}" /></div>
        <div class="form-group"><label>Next Receipt Number</label><input type="number" id="sNext" value="${s.receiptNext || 1001}" min="1" /></div>
        <div class="form-actions"><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Settings</button></div>
      </form>
    </div>
    <div class="panel">
      <h4><i class="fas fa-user-shield"></i> Roles & Permissions — Manager</h4>
      <p style="font-size:.8rem;color:var(--muted);margin-bottom:10px;">Manager account kya kar sakta hai yahan se control karo. Dashboard aur My Profile hamesha available rahenge.</p>
      <div id="permList">
        ${PERM_LABELS.map(([k, label]) => `
          <div class="perm-row"><span>${label} <code style="font-size:.68rem;color:#aaa;">${k}</code></span>
            <label class="switch"><input type="checkbox" data-perm="${k}" ${mp[k] ? 'checked' : ''} /><span class="slider"></span></label></div>`).join('')}
      </div>
      <button class="btn btn-primary mt-16" onclick="savePermissions()"><i class="fas fa-save"></i> Save Permissions</button>
    </div>
    <div class="panel">
      <h4><i class="fas fa-history"></i> Audit Log (latest 100)</h4>
      ${table(['Time','User','Role','Action','Module','Details'],
        auditLog.slice(0, 100).map(a => [fmtDateTime(a.date), esc(a.user), `<span class="badge badge-${a.role === 'admin' ? 'new' : 'scheduled'}">${esc(a.role)}</span>`, esc(a.action), esc(a.module), esc(a.details || '—')]), 'No audit entries.')}
    </div>
    <div class="panel">
      <h4><i class="fas fa-database"></i> Data & Account</h4>
      <p style="color:var(--muted);font-size:.85rem;">Sara data Firebase Firestore mein realtime store hota hai.</p>
      <div class="dash-actions mt-16">
        <button class="btn btn-outline-dark" onclick="exportAllData()"><i class="fas fa-download"></i> Backup (JSON)</button>
        <button class="btn btn-outline-dark" onclick="exportAuditCSV()"><i class="fas fa-file-csv"></i> Export Audit CSV</button>
        <button class="btn btn-outline-dark" onclick="sendMyPasswordReset()"><i class="fas fa-key"></i> Change My Password</button>
      </div>
    </div>`;
  Q('settingsForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const cur = getData('settings', {});
    setData('settings', Object.assign({}, cur, {
      companyName: Q('sName').value, gst: Q('sGst').value, phone: Q('sPhone').value, email: Q('sEmail').value,
      address: Q('sAddress').value, receiptPrefix: Q('sPrefix').value || 'AVYA', receiptNext: Number(Q('sNext').value) || 1001, currency: 'INR'
    }));
    audit('Settings updated', 'Settings', 'Company profile / receipt numbering');
    showToast('Settings saved!', 'success');
  });
}
function savePermissions() {
  const perms = Object.assign({}, getData('permissions', DEFAULT_PERMS));
  perms.manager = Object.assign({}, DEFAULT_PERMS.manager, perms.manager || {});
  document.querySelectorAll('#permList input[data-perm]').forEach(el => { perms.manager[el.dataset.perm] = el.checked; });
  setData('permissions', perms);
  audit('Permissions updated', 'Settings', 'Manager role permissions changed');
  showToast('Permissions saved.', 'success');
}
function exportAllData() {
  const dump = {};
  SHARED.concat(CONFIGS, ['audit']).forEach(k => { dump[k] = getData(k, null); });
  const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'avya_backup_' + todayISO() + '.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded.', 'success');
}
function exportAuditCSV() {
  const logs = getData('audit', []);
  if (!logs.length) return showToast('No audit records.', 'error');
  downloadCSV('avya_audit_log.csv', ['Time','User','Role','Action','Module','Details'], logs.map(a => [fmtDateTime(a.date), a.user, a.role, a.action, a.module, a.details || '']));
}
async function sendMyPasswordReset() {
  if (!currentEmail) return;
  try { await auth.sendPasswordResetEmail(currentEmail); showToast('Password reset link ' + currentEmail + ' par bhej diya.', 'success', 6000); }
  catch (e) { showToast(authMsg(e), 'error'); }
}

/* ============================================================
   26. TARGETS & COMMISSION (Manager)
============================================================ */
function renderTargetsView(c) {
  if (!can('targets.view')) return deny(c);
  const me = getData('managers', []).find(m => m.id === currentManagerId);
  if (!me) return deny(c, 'Manager profile not found.');
  const bookings = getData('bookings', []).filter(b => b.managerId === currentManagerId);
  const month = collectedBy(me.id, true), life = collectedBy(me.id, false);
  const target = Number(me.targetAmount || 0);
  const pct = target ? Math.max(0, Math.min(100, Math.round(month / target * 100))) : 0;
  const cp = Number(me.commissionPct || 0), earned = life * cp / 100;
  const payouts = me.payouts || [], paidOut = payouts.reduce((s, p) => s + Number(p.amount || 0), 0);
  c.innerHTML = `
    <div class="mini-grid">
      <div class="mini-card"><div class="k">Monthly Target</div><div class="v">${fmtMoney(target)}</div></div>
      <div class="mini-card"><div class="k">This Month Collection</div><div class="v" style="color:#16a34a">${fmtMoney(month)}</div></div>
      <div class="mini-card"><div class="k">Achievement</div><div class="v">${pct}%</div><div class="progress"><span style="width:${pct}%"></span></div></div>
      <div class="mini-card"><div class="k">Lifetime Collection</div><div class="v">${fmtMoney(life)}</div></div>
      <div class="mini-card"><div class="k">Commission (${cp}%)</div><div class="v">${fmtMoney(earned)}</div></div>
      <div class="mini-card"><div class="k">Paid Out</div><div class="v">${fmtMoney(paidOut)}</div></div>
      <div class="mini-card"><div class="k">Balance Commission</div><div class="v" style="color:#b45309">${fmtMoney(Math.max(0, earned - paidOut))}</div></div>
    </div>
    <div class="sec-title">My Bookings (${bookings.length})</div>
    ${table(['Customer','Project','Unit','Total','Paid','Balance','Status'],
      bookings.map(b => { const paid = bookingPaid(b.id), bal = Math.max(0, Number(b.totalPrice || 0) - paid);
        return [esc(b.customerName), esc(projectName(b.projectId)), esc(unitLabel(b.unitId)), fmtMoney(b.totalPrice), fmtMoney(paid),
          `<strong style="color:${bal > 0 ? '#dc2626' : '#16a34a'}">${fmtMoney(bal)}</strong>`, statusBadge(b.status)]; }), 'No bookings yet.')}
    <div class="sec-title">Commission Payout History</div>
    ${table(['Date','Amount','Status','Note'], payouts.slice().reverse().map(p => [fmtDate(p.date), fmtMoney(p.amount), statusBadge(p.status || 'paid'), esc(p.note || '—')]), 'No payouts recorded yet.')}`;
}

/* ============================================================
   27. MY PROFILE (Manager)
============================================================ */
function renderProfileView(c) {
  if (currentUser !== 'manager') return deny(c, 'This view is for managers only.');
  const m = getData('managers', []).find(x => x.id === currentManagerId);
  if (!m) return deny(c, 'Profile not found.');
  const myLeads = getData('leads', []).filter(l => l.managerId === m.id);
  const myBookings = getData('bookings', []).filter(b => b.managerId === m.id);
  const month = collectedBy(m.id, true), target = Number(m.targetAmount || 0);
  const pct = target ? Math.max(0, Math.min(100, Math.round(month / target * 100))) : 0;
  const initials = String(m.fullName || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();

  c.innerHTML = `
    <div class="card-form" style="max-width:780px;">
      <div style="display:flex;align-items:center;gap:20px;margin-bottom:22px;flex-wrap:wrap;">
        <div style="width:78px;height:78px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800;color:#fff;">${esc(initials)}</div>
        <div>
          <h3 style="font-size:1.35rem;">${esc(m.fullName)}</h3>
          <div style="color:var(--muted);font-size:.85rem;">${esc(m.empId)} • ${esc(m.designation || 'Manager')} • ${statusBadge(m.status)}</div>
          <div style="color:var(--muted);font-size:.8rem;">Joined ${fmtDate(m.joiningDate)}</div>
        </div>
      </div>

      <div class="mini-grid">
        <div class="mini-card"><div class="k">My Leads</div><div class="v">${myLeads.length}</div></div>
        <div class="mini-card"><div class="k">My Bookings</div><div class="v">${myBookings.length}</div></div>
        <div class="mini-card"><div class="k">This Month</div><div class="v">${fmtShort(month)}</div></div>
        <div class="mini-card"><div class="k">Target</div><div class="v">${pct}%</div><div class="progress"><span style="width:${pct}%"></span></div></div>
      </div>

      <h4 class="mb-16">Personal Details</h4>
      <form id="profileForm" class="form-2col">
        <div class="form-group"><label>Full Name</label><input type="text" id="pfName" value="${esc(m.fullName)}" required /></div>
        <div class="form-group"><label>Mobile</label><input type="tel" id="pfMobile" value="${esc(m.mobile)}" required /></div>
        <div class="form-group"><label>Login Email</label><input type="email" value="${esc(m.email || currentEmail)}" disabled /></div>
        <div class="form-group"><label>Employee ID</label><input type="text" value="${esc(m.empId)}" disabled /></div>
        <div class="form-group"><label>Department</label><input type="text" value="${esc(m.department || '')}" disabled /></div>
        <div class="form-group"><label>Assigned Area</label><input type="text" value="${esc(m.area || '')}" disabled /></div>
        <div class="form-group full"><label>Address</label><input type="text" id="pfAddress" value="${esc(m.address || '')}" /></div>
        <div class="form-group full"><label>Emergency Contact</label><input type="text" id="pfEmergency" value="${esc(m.emergency || '')}" /></div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Profile</button>
          <button type="button" class="btn btn-outline-dark" onclick="printManager('${m.id}')"><i class="fas fa-print"></i> Print Profile</button>
          <button type="button" class="btn btn-outline-dark" onclick="sendMyPasswordReset()"><i class="fas fa-key"></i> Change Password</button>
        </div>
      </form>

      <div class="panel mt-24" style="background:var(--light);">
        <h4>Assigned Projects</h4>
        <p style="font-size:.85rem;">${esc((m.projects || []).join(', ') || 'No projects assigned yet. Admin se assign karwao.')}</p>
      </div>
      <div class="panel" style="background:var(--light);margin-bottom:0;">
        <h4>Account</h4>
        <p style="font-size:.82rem;color:var(--muted);">Target: ${fmtMoney(target)} / month • Commission: ${esc(m.commissionPct || 0)}%<br />
        Designation, target, commission aur projects sirf admin badal sakta hai.</p>
      </div>
    </div>`;

  Q('profileForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const mobile = Q('pfMobile').value.replace(/\D/g, '').slice(-10);
    if (mobile.length !== 10) return showToast('Valid 10-digit mobile required.', 'error');
    const name = Q('pfName').value.trim();
    if (!name) return showToast('Name is required.', 'error');
    const managers = getData('managers', []);
    const idx = managers.findIndex(x => x.id === m.id);
    managers[idx] = Object.assign({}, managers[idx], { fullName: name, mobile, address: Q('pfAddress').value.trim(), emergency: Q('pfEmergency').value.trim() });
    currentName = name;
    setData('managers', managers);
    audit('Profile updated', 'Profile', name);
    Q('dashUser').innerHTML = `<i class="fas fa-user-circle"></i><span>${esc(name)}</span><small>manager</small>`;
    showToast('Profile updated!', 'success');
  });
}

window.addEventListener('beforeprint', () => { document.body.style.overflow = 'hidden'; });
window.addEventListener('afterprint', () => { document.body.style.overflow = ''; });
</script>
</body>
</html>
