<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AVYA Associate Portal</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="cloudinary-config.js"></script>
    <script src="db.js"></script>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2>AVYA<span style="color:var(--red);">.</span> ASSOCIATE</h2>
            <div class="sub">Sign in with the login your admin gave you.</div>
            <form id="loginForm" novalidate>
                <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required /></div>
                <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required /></div>
                <div id="loginError" style="color:var(--red);font-size:0.8rem;margin-bottom:12px;display:none;"></div>
                <button type="submit" class="btn btn-primary w-full" style="justify-content:center;" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
            </form>
            <p style="font-size:0.75rem;color:var(--muted);margin-top:16px;">Don't have a login yet? Ask your Admin to add you from the Associates section of the Admin panel.</p>
            <a href="index.html" style="display:block;text-align:center;margin-top:12px;font-size:0.8rem;color:var(--muted);">&larr; Back to website</a>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard-shell" id="dashboardShell" style="display:none;">
        <aside class="dash-sidebar">
            <div class="brand"><h3>AVYA<span class="red">.</span></h3><small>ASSOCIATE PORTAL</small></div>
            <div id="dashNavItems"></div>
            <div class="spacer"></div>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </aside>
        <main class="dash-main">
            <div class="header"><h2 id="dashTitle">Dashboard</h2><span class="badge-live"><i class="fas fa-circle" style="font-size:6px;"></i> LIVE</span></div>
            <div id="dashContent"></div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        let currentView = 'dashboard';
        let currentManagerId = null;
        let currentManagerData = null;

        function showToast(message, type = 'info', duration = 4000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
            toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, duration);
        }
        function badgeClass(status) { return 'badge-' + String(status || '').replace(/\s+/g, '-').toLowerCase(); }

        // ---------------- AUTH ----------------
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errBox = document.getElementById('loginError');
            errBox.style.display = 'none';
            btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Signing in…';
            try {
                const email = document.getElementById('loginEmail').value.trim();
                const pass = document.getElementById('loginPassword').value;
                const cred = await auth.signInWithEmailAndPassword(email, pass);
                const roleDoc = await DB.getUserRole(cred.user.uid);
                if (!roleDoc || roleDoc.role !== 'manager') {
                    await auth.signOut();
                    errBox.textContent = 'This login is not registered as an Associate.';
                    errBox.style.display = 'block';
                }
            } catch (err) {
                errBox.textContent = err.message.replace('Firebase: ', '');
                errBox.style.display = 'block';
            } finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login'; }
        });

        auth.onAuthStateChanged(async (user) => {
            if (!user) { document.getElementById('loginScreen').style.display = 'flex'; document.getElementById('dashboardShell').style.display = 'none'; return; }
            const roleDoc = await DB.getUserRole(user.uid);
            if (!roleDoc || roleDoc.role !== 'manager') { document.getElementById('loginScreen').style.display = 'flex'; document.getElementById('dashboardShell').style.display = 'none'; return; }
            currentManagerId = roleDoc.managerId;
            currentManagerData = await DB.getManager(currentManagerId);
            if (currentManagerData && currentManagerData.status === 'inactive') {
                await auth.signOut();
                document.getElementById('loginError').textContent = 'Your account has been deactivated. Contact your Admin.';
                document.getElementById('loginError').style.display = 'block';
                return;
            }
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardShell').style.display = 'flex';
            renderNav();
            navigateTo('dashboard');
        });

        function logout() { if (!confirm('Logout?')) return; auth.signOut(); }

        // ---------------- NAV ----------------
        function renderNav() {
            const items = [
                { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                { id: 'leads', label: 'My Leads', icon: 'fa-user-plus' },
                { id: 'customers', label: 'Customers', icon: 'fa-user-check' },
                { id: 'sitevisits', label: 'Site Visits', icon: 'fa-calendar-check' },
                { id: 'followups', label: 'Follow-Ups', icon: 'fa-bell' },
                { id: 'profile', label: 'Profile', icon: 'fa-user' }
            ];
            document.getElementById('dashNavItems').innerHTML = items.map(i => `<div class="nav-item ${currentView===i.id?'active':''}" data-view="${i.id}"><i class="fas ${i.icon}"></i><span>${i.label}</span></div>`).join('');
            document.querySelectorAll('#dashNavItems .nav-item').forEach(el => el.addEventListener('click', () => navigateTo(el.dataset.view)));
        }
        function navigateTo(view) {
            currentView = view;
            document.querySelectorAll('#dashNavItems .nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
            document.getElementById('dashTitle').textContent = view.charAt(0).toUpperCase() + view.slice(1);
            const map = { dashboard: renderDashboard, leads: renderLeadsView, customers: renderCustomersView, sitevisits: renderSiteVisitsView, followups: renderFollowUpsView, profile: renderProfileView };
            const c = document.getElementById('dashContent');
            c.innerHTML = '<p style="color:var(--muted);padding:20px 0;"><span class="spinner dark"></span> Loading…</p>';
            (map[view] || (() => c.innerHTML = '<p>Not found.</p>'))(c);
        }

        // ---------------- DASHBOARD ----------------
        async function renderDashboard(c) {
            const [leads, visits, customers, followups] = await Promise.all([
                DB.getLeads(currentManagerId), DB.getSiteVisits(currentManagerId), DB.getCustomers(currentManagerId), DB.getFollowUps(currentManagerId)
            ]);
            const newLeads = leads.filter(l => l.status === 'new').length;
            const pending = followups.filter(f => f.status === 'pending').length;
            c.innerHTML = `<div class="dash-stats">
                <div class="dash-stat"><div class="num">${leads.length}</div><div class="label">My Leads</div></div>
                <div class="dash-stat"><div class="num">${newLeads}</div><div class="label">New</div></div>
                <div class="dash-stat"><div class="num">${visits.length}</div><div class="label">Site Visits</div></div>
                <div class="dash-stat"><div class="num">${customers.length}</div><div class="label">My Customers</div></div>
                <div class="dash-stat"><div class="num">${pending}</div><div class="label">Pending Follow-ups</div></div>
                </div>
                <h4 style="margin:12px 0 8px;font-weight:700;">Today's Follow-ups</h4>
                <div class="dash-table-wrap"><table><thead><tr><th>Client</th><th>Project</th><th>Purpose</th><th>Status</th></tr></thead>
                <tbody>${followups.filter(f => f.status === 'pending').slice(0,6).map(f => `<tr><td>${f.client}</td><td>${f.project||'—'}</td><td>${f.purpose||'—'}</td><td><span class="badge ${badgeClass(f.status)}">${f.status}</span></td></tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:20px;">No pending follow-ups.</td></tr>'}</tbody></table></div>`;
        }

        // ---------------- LEADS (own only) ----------------
        async function renderLeadsView(c) {
            const leads = await DB.getLeads(currentManagerId);
            window.__leads = leads;
            c.innerHTML = `<div class="dash-actions"><button class="btn btn-primary" onclick="showAddLead()"><i class="fas fa-plus"></i> Add Lead</button></div>
                <div class="dash-table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Project</th><th>Status</th><th>Follow-up</th><th>Actions</th></tr></thead>
                <tbody>${leads.map(l => `<tr><td><strong>${l.name}</strong></td><td>${l.phone}</td><td>${l.project||'—'}</td><td><span class="badge ${badgeClass(l.status)}">${l.status}</span></td><td>${l.followUp||'—'}</td>
                <td><button class="btn btn-sm btn-outline-dark" onclick="editLead('${l.id}')"><i class="fas fa-edit"></i></button></td></tr>`).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px;">No leads assigned to you yet.</td></tr>'}</tbody></table></div>`;
        }
        function leadFormFields(l = {}) {
            return `
                <div class="form-group"><label>Name *</label><input type="text" id="lName" value="${l.name||''}" required /></div>
                <div class="form-group"><label>Phone *</label><input type="tel" id="lPhone" value="${l.phone||''}" required /></div>
                <div class="form-group"><label>Email</label><input type="email" id="lEmail" value="${l.email||''}" /></div>
                <div class="form-group"><label>Project</label><input type="text" id="lProject" value="${l.project||''}" /></div>
                <div class="form-group full"><label>Status</label><select id="lStatus"><option value="new" ${l.status==='new'?'selected':''}>New</option><option value="contacted" ${l.status==='contacted'?'selected':''}>Contacted</option><option value="interested" ${l.status==='interested'?'selected':''}>Interested</option><option value="site visit scheduled" ${l.status==='site visit scheduled'?'selected':''}>Site Visit Scheduled</option><option value="visited" ${l.status==='visited'?'selected':''}>Visited</option><option value="negotiation" ${l.status==='negotiation'?'selected':''}>Negotiation</option><option value="booked" ${l.status==='booked'?'selected':''}>Booked</option><option value="lost" ${l.status==='lost'?'selected':''}>Lost</option></select></div>
                <div class="form-group full"><label>Next Follow-up</label><input type="date" id="lFollowUp" value="${l.followUp||''}" /></div>
                <div class="form-group full"><label>Notes</label><textarea id="lNotes" rows="2">${l.notes||''}</textarea></div>`;
        }
        function showAddLead() {
            document.getElementById('dashContent').innerHTML = `<h3 style="margin-bottom:16px;">Add Lead</h3><form id="leadForm" class="form-2col" style="max-width:700px;">${leadFormFields()}
                <div class="form-group full" style="display:flex;gap:12px;flex-wrap:wrap;"><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button><button type="button" class="btn btn-outline-dark" onclick="navigateTo('leads')">Cancel</button></div></form>`;
            document.getElementById('leadForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const phone = document.getElementById('lPhone').value.replace(/\D/g, '');
                if (phone.length !== 10) { showToast('Enter a valid 10-digit phone number.', 'error'); return; }
                await DB.addLead({ name: document.getElementById('lName').value.trim(), phone, email: document.getElementById('lEmail').value.trim(),
                    project: document.getElementById('lProject').value.trim(), status: document.getElementById('lStatus').value,
                    followUp: document.getElementById('lFollowUp').value, notes: document.getElementById('lNotes').value.trim(), managerId: currentManagerId });
                showToast('Lead added!', 'success'); navigateTo('leads');
            });
        }
        async function editLead(id) {
            const l = (window.__leads || []).find(x => x.id === id);
            document.getElementById('dashContent').innerHTML = `<h3 style="margin-bottom:16px;">Edit Lead</h3><form id="leadForm" class="form-2col" style="max-width:700px;">${leadFormFields(l)}
                <div class="form-group full" style="display:flex;gap:12px;flex-wrap:wrap;"><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update</button><button type="button" class="btn btn-outline-dark" onclick="navigateTo('leads')">Cancel</button></div></form>`;
            document.getElementById('leadForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const phone = document.getElementById('lPhone').value.replace(/\D/g, '');
                if (phone.length !== 10) { showToast('Enter a valid 10-digit phone number.', 'error'); return; }
                await DB.updateLead(id, { name: document.getElementById('lName').value.trim(), phone, email: document.getElementById('lEmail').value.trim(),
                    project: document.getElementById('lProject').value.trim(), status: document.getElementById('lStatus').value,
                    followUp: document.getElementById('lFollowUp').value, notes: document.getElementById('lNotes').value.trim() });
                showToast('Updated!', 'success'); navigateTo('leads');
            });
        }

        // ---------------- CUSTOMERS (own only) ----------------
        async function renderCustomersView(c) {
            const customers = await DB.getCustomers(currentManagerId);
            c.innerHTML = `<div class="dash-table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Project</th><th>Status</th></tr></thead>
                <tbody>${customers.map(cu => `<tr><td><strong>${cu.name}</strong></td><td>${cu.phone}</td><td>${cu.project||'—'}</td><td><span class="badge ${badgeClass(cu.status)}">${cu.status}</span></td></tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:30px;">No customers yet.</td></tr>'}</tbody></table></div>`;
        }

        // ---------------- SITE VISITS (own only) ----------------
        async function renderSiteVisitsView(c) {
            const visits = await DB.getSiteVisits(currentManagerId);
            c.innerHTML = `<div class="dash-table-wrap"><table><thead><tr><th>Customer</th><th>Project</th><th>Date</th><th>Time</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody>${visits.map(v => `<tr><td><strong>${v.customer}</strong></td><td>${v.project||'—'}</td><td>${v.date}</td><td>${v.time||'—'}</td><td><span class="badge ${badgeClass(v.status)}">${v.status}</span></td>
                <td><button class="btn btn-sm btn-outline-dark" onclick="updateVisit('${v.id}','completed')"><i class="fas fa-check"></i></button></td></tr>`).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px;">No site visits assigned to you.</td></tr>'}</tbody></table></div>`;
        }
        async function updateVisit(id, status) { await DB.updateSiteVisit(id, { status }); showToast(`Visit ${status}.`, 'success'); navigateTo('sitevisits'); }

        // ---------------- FOLLOW-UPS (own only) ----------------
        async function renderFollowUpsView(c) {
            const followups = await DB.getFollowUps(currentManagerId);
            c.innerHTML = `<div class="dash-actions"><button class="btn btn-primary" onclick="showAddFollowUp()"><i class="fas fa-plus"></i> Add Follow-up</button></div>
                <div class="dash-table-wrap"><table><thead><tr><th>Client</th><th>Project</th><th>Date</th><th>Purpose</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody>${followups.map(f => `<tr><td><strong>${f.client}</strong></td><td>${f.project||'—'}</td><td>${f.date}</td><td>${f.purpose||'—'}</td><td><span class="badge ${f.status==='completed'?'badge-completed':'badge-pending'}">${f.status}</span></td>
                <td><button class="btn btn-sm btn-outline-dark" onclick="completeFollowUp('${f.id}')"><i class="fas fa-check"></i></button></td></tr>`).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px;">No follow-ups yet.</td></tr>'}</tbody></table></div>`;
        }
        function showAddFollowUp() {
            document.getElementById('dashContent').innerHTML = `<h3 style="margin-bottom:16px;">Add Follow-up</h3><form id="fuForm" style="max-width:600px;">
                <div class="form-group"><label>Client *</label><input type="text" id="fuClient" required /></div>
                <div class="form-group"><label>Project</label><input type="text" id="fuProject" /></div>
                <div class="form-row"><div class="form-group"><label>Date</label><input type="date" id="fuDate" /></div><div class="form-group"><label>Time</label><input type="time" id="fuTime" /></div></div>
                <div class="form-group"><label>Purpose</label><input type="text" id="fuPurpose" /></div>
                <div class="form-group"><label>Notes</label><textarea id="fuNotes" rows="2"></textarea></div>
                <div style="display:flex;gap:12px;flex-wrap:wrap;"><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button><button type="button" class="btn btn-outline-dark" onclick="navigateTo('followups')">Cancel</button></div></form>`;
            document.getElementById('fuForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                await DB.addFollowUp({ client: document.getElementById('fuClient').value.trim(), project: document.getElementById('fuProject').value.trim(),
                    date: document.getElementById('fuDate').value || new Date().toISOString().slice(0,10), time: document.getElementById('fuTime').value,
                    purpose: document.getElementById('fuPurpose').value.trim(), notes: document.getElementById('fuNotes').value.trim(), managerId: currentManagerId });
                showToast('Follow-up added!', 'success'); navigateTo('followups');
            });
        }
        async function completeFollowUp(id) { await DB.updateFollowUp(id, { status: 'completed' }); showToast('Marked complete!', 'success'); navigateTo('followups'); }

        // ---------------- PROFILE (with Cloudinary photo upload) ----------------
        async function renderProfileView(c) {
            const m = currentManagerData || await DB.getManager(currentManagerId);
            c.innerHTML = `<div style="max-width:600px;background:var(--white);padding:32px;border-radius:var(--radius);border:1px solid rgba(0,0,0,0.04);">
                <div style="display:flex;align-items:center;gap:20px;margin-bottom:20px;">
                    <div class="upload-box" id="profImgBox" style="width:90px;height:90px;border-radius:50%;padding:0;overflow:hidden;flex-shrink:0;" onclick="document.getElementById('profImgInput').click()">
                        ${m.photo ? `<img src="${m.photo}" style="width:100%;height:100%;object-fit:cover;" id="profImgPreview" />` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--muted);"><i class="fas fa-camera"></i></div>`}
                    </div>
                    <input type="file" id="profImgInput" accept="image/*" style="display:none;" />
                    <div><h3 style="font-size:1.3rem;">${m.fullName}</h3><div style="color:var(--muted);">${m.designation||'Associate'}</div></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                    <div><strong>Mobile</strong><br />${m.mobile}</div>
                    <div><strong>Email</strong><br />${m.email}</div>
                    <div><strong>Area</strong><br />${m.area||'—'}</div>
                    <div><strong>Status</strong><br /><span class="badge ${m.status==='active'?'badge-active':'badge-inactive'}">${m.status}</span></div>
                </div></div>`;
            document.getElementById('profImgInput').addEventListener('change', async function() {
                const file = this.files[0]; if (!file) return;
                try {
                    const url = await uploadToCloudinary(file);
                    await DB.updateManager(currentManagerId, { photo: url });
                    showToast('Profile photo updated!', 'success');
                    navigateTo('profile');
                } catch (err) { showToast(err.message, 'error'); }
            });
        }
    </script>
</body>
</html>
